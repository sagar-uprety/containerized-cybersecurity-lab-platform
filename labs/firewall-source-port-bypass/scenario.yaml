id: firewall-source-port-bypass
title: Firewall Rule Misconfiguration — Source-Port Bypass
difficulty: intermediate

story:
  role: Network security auditor
  situation: >
    The organization's perimeter firewall was configured by a previous
    administrator with a source-port shortcut for identifying reply traffic.
    Management wants you to verify that an internal web service is protected
    from new connections arriving from the external network.

documentation:
  student_guide_url: /docs/labs/firewall-source-port-bypass/
  solution_notes_url: /docs/labs/firewall-source-port-bypass-solution/
  instructor_guide_url: /docs/labs/firewall-source-port-bypass-instructor/

access:
  ssh_port_base: 22000
  browser_terminal_port_base: 19000

lifecycle:
  idle_timeout_minutes: 30
  max_runtime_minutes: 120
  evaluation_idle_timeout_minutes: null
  retention_after_stop_minutes: 180

checker:
  version: 2
  states:
    - vulnerable
    - fixed
  checks:
    - name: fw_path_ready
      label: "Internal service and forwarding path are ready"
      kind: guardrail
      exec_in: firewall-host
      run: >-
        INTERNAL_SERVER_IP=$(getent hosts internal-server | awk 'NR == 1 {print $1}') &&
        [ "$(sysctl -n net.ipv4.ip_forward)" = 1 ] &&
        curl -sf --connect-timeout 3 http://internal-server:8080/health >/dev/null &&
        iptables-save -t nat | grep -F --
        "--dport 8080 -j DNAT --to-destination ${INTERNAL_SERVER_IP}:8080" >/dev/null &&
        iptables-save -t nat | grep -F -- '-A POSTROUTING -j MASQUERADE' >/dev/null &&
        iptables -t nat -Z PREROUTING &&
        echo FORWARDING_PATH_READY || echo FORWARDING_PATH_BROKEN
      states:
        vulnerable: "output_contains: FORWARDING_PATH_READY"
        fixed: "output_contains: FORWARDING_PATH_READY"
    - name: fw_sourceport80
      label: "Source-port 80 bypass is blocked"
      kind: objective
      exec_in: workstation
      run: >-
        FW_IP=$(cat /lab/config/fw_external_ip.txt 2>/dev/null) &&
        CODE=$(curl --local-port 80 -s -o /dev/null -w '%{http_code}'
        --connect-timeout 5 "http://${FW_IP}:8080/" 2>/dev/null || true) &&
        if [ "$CODE" = 200 ]; then echo BYPASS_SUCCEEDED;
        else echo BYPASS_BLOCKED; fi
      states:
        vulnerable: "output_contains: BYPASS_SUCCEEDED"
        fixed: "output_contains: BYPASS_BLOCKED"
    - name: fw_stateful_rules
      label: "Active and persistent rules use connection state"
      kind: objective
      exec_in: firewall-host
      run: >-
        ACTIVE=$(iptables-save -t filter) &&
        PERSISTENT=$(cat /etc/iptables/rules.v4) &&
        if printf '%s\n' "$ACTIVE" | grep -q '^:FORWARD DROP ' &&
        printf '%s\n' "$PERSISTENT" | grep -q '^:FORWARD DROP ' &&
        printf '%s\n' "$ACTIVE" | grep -Eq --
        '^-A FORWARD -m conntrack --ctstate (ESTABLISHED,RELATED|RELATED,ESTABLISHED) -j ACCEPT$' &&
        printf '%s\n' "$PERSISTENT" | grep -Eq --
        '^-A FORWARD -m conntrack --ctstate (ESTABLISHED,RELATED|RELATED,ESTABLISHED) -j ACCEPT$' &&
        [ "$(printf '%s\n' "$ACTIVE" | grep -c '^-A FORWARD ')" -eq 1 ] &&
        [ "$(printf '%s\n' "$PERSISTENT" | grep -c '^-A FORWARD ')" -eq 1 ];
        then echo STATEFUL_RULESET; else echo SOURCE_PORT_RULESET; fi
      states:
        vulnerable: "output_contains: SOURCE_PORT_RULESET"
        fixed: "output_contains: STATEFUL_RULESET"
    - name: fw_forwarding_path
      label: "Workstation probe traverses the DNAT path"
      kind: guardrail
      exec_in: firewall-host
      run: >-
        INTERNAL_SERVER_IP=$(getent hosts internal-server | awk 'NR == 1 {print $1}') &&
        curl -sf --connect-timeout 3 http://internal-server:8080/health >/dev/null &&
        iptables -t nat -L PREROUTING -n -v -x |
        awk -v target="${INTERNAL_SERVER_IP}:8080"
        '$1 ~ /^[0-9]+$/ && $1 > 0 && $0 ~ /dpt:8080/ &&
        index($0, target) { found=1 } END { exit !found }' &&
        echo FORWARDING_PATH_HEALTHY || echo FORWARDING_PATH_BROKEN
      states:
        vulnerable: "output_contains: FORWARDING_PATH_HEALTHY"
        fixed: "output_contains: FORWARDING_PATH_HEALTHY"

build:
  images:
    - service: firewall-host
      name: thesis-labs/firewall-source-port-bypass-fw:latest
      context: .
      dockerfile: Dockerfile.firewall
    - service: internal-server
      name: thesis-labs/firewall-source-port-bypass-server:latest
      context: .
      dockerfile: Dockerfile.server

services:
  workstation:
    image: thesis-labs/workstation-base:latest
    role: Student browser terminal and SSH fallback.
    internal_ports:
      browser_terminal: 19000
      ssh: 22
  firewall-host:
    image: thesis-labs/firewall-source-port-bypass-fw:latest
    role: Stateful firewall protecting the internal network.
    internal_ports:
      ssh: 22
  internal-server:
    image: thesis-labs/firewall-source-port-bypass-server:latest
    role: Internal web server behind the firewall.
    internal_ports:
      http: 8080

resources:
  workstation:
    cpus: "0.50"
    memory: "256m"
  firewall-host:
    cpus: "0.50"
    memory: "256m"
  internal-server:
    cpus: "0.50"
    memory: "256m"

# Two-network topology: external (workstation <-> firewall) and internal (firewall <-> server).
# The firewall bridges both networks. The workstation can only reach the internal-server
# through the firewall — this is what makes the source-port bypass exploitable.
networks:
  - name: external
  - name: internal

workstation:
  environment:
    FIREWALL_HOST: firewall-host
    INTERNAL_SERVER_HOST: internal-server
  shared_volumes:
    - name: fw_config
      target: /lab/config
  depends_on:
    - firewall-host
    - internal-server
  cap_add:
    - NET_RAW
    # NET_BIND_SERVICE lets the non-root student bind curl to source port 80,
    # required to demonstrate/verify the source-port bypass documented in
    # solution-notes.md (`curl --local-port 80 ...`).
    - NET_BIND_SERVICE

containers:
  - service: firewall-host
    hostname: firewall-host
    networks:
      - external
      - internal
    init: true
    restart: unless-stopped
    environment:
      LAB_ADMIN_USER: firewall
      LAB_CONFIG_SRC: /opt/lab/baseline/rules.v4
      LAB_CONFIG_DST: /etc/iptables/rules.v4
      LAB_SERVICE_CMD: "/opt/lab/start-firewall.sh"
      LAB_DATA_DIR: /etc/iptables
      LAB_DATA_USER: root
      LAB_LOG_FILE: /var/log/firewall.log
      SERVICE_ADMIN_PASSWORD: "$platform.student_password"
    expose:
      - 22
    volumes:
      - name: fw_config
        target: /lab/config
      - name: fw_state
        target: /var/lib/firewall
    healthcheck:
      command:
        - CMD-SHELL
        - "iptables -L FORWARD -n >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    security:
      privileged: false
      host_network: false
      cap_add:
        - NET_ADMIN
        - AUDIT_WRITE

  - service: internal-server
    hostname: internal-server
    networks:
      - internal
    init: true
    restart: unless-stopped
    environment:
      LAB_CONFIG_SRC: /opt/lab/baseline/nginx.conf
      LAB_CONFIG_DST: /etc/nginx/sites-enabled/default
      LAB_SERVICE_CMD: "nginx -g 'daemon off;'"
      LAB_DATA_DIR: /var/www/html
      LAB_DATA_USER: www-data
      LAB_LOG_FILE: /var/log/nginx/access.log
    expose:
      - 8080
    volumes:
      - name: server_data
        target: /var/www/html
      - name: fw_config
        target: /lab/config
    healthcheck:
      command:
        - CMD-SHELL
        - "curl -sf http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    security:
      privileged: false
      host_network: false
