id: ldap-anonymous-bind
title: "LDAP Directory Access Control"
difficulty: intermediate

story:
  summary: "Learn to find a directory service leaking data to anonymous binds, then restrict reads to authenticated users."

documentation:
  student_guide_url: /docs/labs/ldap-anonymous-bind/
  solution_notes_url: /docs/labs/ldap-anonymous-bind-solution/
  instructor_guide_url: /docs/labs/ldap-anonymous-bind-instructor/

access:
  ssh_port_base: 33000
  browser_terminal_port_base: 19100

lifecycle:
  idle_timeout_minutes: 30
  max_runtime_minutes: 120
  evaluation_idle_timeout_minutes: null
  retention_after_stop_minutes: 180

checker:
  version: 2
  states:
    - vulnerable
    - fixed
  checks:
    - name: ldap_anonymous_search
      label: "Anonymous LDAP read/search access is blocked"
      kind: objective
      exec_in: workstation
      run: >
        OUT=$(LDAPTLS_REQCERT=never ldapsearch -x -ZZ -H ldap://ldap-host
        -b 'dc=lab,dc=local' '(objectClass=posixAccount)' cn 2>&1); RC=$?;
        if [ "$RC" -eq 0 ] && echo "$OUT" | grep -q '^cn:'; then echo ANONYMOUS_READABLE;
        elif echo "$OUT" | grep -q 'Insufficient access'; then echo ANONYMOUS_BLOCKED;
        else
        OUT=$(ldapsearch -x -H ldap://ldap-host -b 'dc=lab,dc=local'
        '(objectClass=posixAccount)' cn 2>&1); RC=$?;
        if [ "$RC" -eq 0 ] && echo "$OUT" | grep -q '^cn:'; then echo ANONYMOUS_READABLE;
        elif echo "$OUT" | grep -q 'Insufficient access'; then echo ANONYMOUS_BLOCKED;
        else echo CHECK_ERROR; fi;
        fi
      states:
        vulnerable: "output_eq: ANONYMOUS_READABLE"
        fixed: "output_eq: ANONYMOUS_BLOCKED"
    - name: ldap_tls_enforced
      label: "Authenticated plaintext LDAP is rejected"
      kind: objective
      exec_in: workstation
      run: >
        OUT=$(ldapsearch -x -H ldap://ldap-host -D 'cn=admin,dc=lab,dc=local'
        -w dummypassword -b 'dc=lab,dc=local' '(objectClass=posixAccount)' cn 2>&1); RC=$?;
        if [ "$RC" -eq 0 ] && echo "$OUT" | grep -q '^cn:'; then echo PLAINTEXT_ALLOWED;
        elif echo "$OUT" | grep -q 'Confidentiality required'; then echo PLAINTEXT_REJECTED;
        else echo CHECK_ERROR; fi
      states:
        vulnerable: "output_eq: PLAINTEXT_ALLOWED"
        fixed: "output_eq: PLAINTEXT_REJECTED"
    - name: ldap_authenticated_search
      label: "Authenticated directory access remains available"
      kind: guardrail
      exec_in: workstation
      run: >
        OUT=$(LDAPTLS_REQCERT=never ldapsearch -x -ZZ -H ldap://ldap-host
        -D 'cn=admin,dc=lab,dc=local' -w dummypassword -b 'dc=lab,dc=local'
        '(objectClass=posixAccount)' cn 2>&1); RC=$?;
        if [ "$RC" -eq 0 ] && echo "$OUT" | grep -q '^cn:'; then echo AUTH_OK_STARTTLS;
        else
        OUT=$(ldapsearch -x -H ldap://ldap-host -D 'cn=admin,dc=lab,dc=local'
        -w dummypassword -b 'dc=lab,dc=local' '(objectClass=posixAccount)' cn 2>&1); RC=$?;
        if [ "$RC" -eq 0 ] && echo "$OUT" | grep -q '^cn:'; then echo AUTH_OK_PLAINTEXT;
        else echo AUTH_FAILED; fi;
        fi
      states:
        vulnerable: "output_contains: AUTH_OK_"
        fixed: "output_contains: AUTH_OK_"

build:
  images:
    - service: ldap-host
      name: thesis-labs/ldap-anonymous-bind-ldap:latest
      context: .
      dockerfile: Dockerfile

services:
  workstation:
    image: thesis-labs/workstation-base:latest
    role: Student browser terminal and SSH fallback.
    internal_ports:
      browser_terminal: 19000
      ssh: 22
  ldap-host:
    image: thesis-labs/ldap-anonymous-bind-ldap:latest
    role: Vulnerable OpenLDAP server.
    internal_ports:
      ldap: 389

resources:
  workstation:
    cpus: "0.50"
    memory: "256m"
  ldap-host:
    cpus: "0.50"
    memory: "512m"

workstation:
  environment:
    LDAP_HOST: ldap-host
    LDAP_PORT: "389"
  depends_on:
    - ldap-host
  shared_volumes:
    - name: ldap_access
      target: /lab/access
  cap_add:
    - NET_RAW

containers:
  - service: ldap-host
    hostname: ldap-host
    init: false
    restart: unless-stopped
    environment:
      LAB_CONFIG_SRC: /opt/lab/baseline/slapd-config.ldif
      LAB_CONFIG_DST: /etc/ldap/slapd.d/config-applied.flag
      LAB_SERVICE_CMD: "/usr/sbin/slapd -h 'ldap:/// ldaps:/// ldapi:///' -u openldap -g openldap -F /etc/ldap/slapd.d"
      LAB_DATA_DIR: /var/lib/ldap
      LAB_DATA_USER: openldap
      LAB_SETUP_SCRIPT: /opt/lab/hooks/pre-start.sh
      LAB_LOG_FILE: /var/log/slapd.log
      LAB_ADMIN_USER: root
      SERVICE_ADMIN_PASSWORD: "$platform.student_password"
    expose:
      - 389
    volumes:
      - name: ldap_data
        target: /var/lib/ldap
      - name: ldap_config
        target: /etc/ldap/slapd.d
      - name: ldap_access
        target: /lab/access
    healthcheck:
      command:
        - CMD-SHELL
        - "ldapsearch -x -H ldapi:// -b '' -s base '(objectClass=*)' >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security:
      privileged: false
      host_network: false
