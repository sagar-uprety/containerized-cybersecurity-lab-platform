lab_id: ldap-anonymous-bind

intentional_findings:
  - id: ldap-demo-user-passwords
    tool: gitleaks
    files:
      - setup-vulnerable.sh
    patterns:
      - "dummypassword"
    reason: >
      Synthetic admin password and user password hashes are intentionally
      planted for the lab. Students discover weak credentials during
      investigation and replace them during remediation.

  - id: ldap-demo-solution-passwords
    tool: gitleaks
    files:
      - docs/solution-notes.md
    patterns:
      - "dummypassword"
    reason: >
      Instructor-only solution notes reference the demo directory bind
      password to document the expected ldapmodify/verification workflow.
