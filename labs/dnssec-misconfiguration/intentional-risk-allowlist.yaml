lab_id: dnssec-misconfiguration

intentional_findings:
  - id: dns-open-recursive-resolver
    tool: trivy
    files:
      - config.vulnerable
    patterns:
      - allow-recursion { any; }
      - dnssec-validation no
    reason: >
      An open recursive resolver with DNSSEC validation disabled is the
      isolated teaching vulnerability students must discover and remediate.
      The forwarder only ever reaches the lab's own controlled authoritative
      host on an internal-only Podman network; no real recursive traffic
      leaves the lab topology.

  - id: dns-auth-no-validation
    tool: trivy
    files:
      - dns-auth/config.vulnerable
    patterns:
      - dnssec-validation no
    reason: >
      The authoritative host does not itself need to validate anything (it
      serves its own signed zone); this line matches the same scanner
      pattern as the resolver's baseline and is not a student-facing finding.
