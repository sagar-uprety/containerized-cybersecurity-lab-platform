lab_id: network-zone-isolation

intentional_findings:
  - id: nzi-flat-forward-policy
    tool: shellcheck
    files:
      - config.vulnerable
    patterns:
      - ":FORWARD ACCEPT"
    reason: >
      An unrestricted FORWARD policy with no zone-scoped rules is the
      intentional vulnerability. Students discover that the gateway forwards
      DMZ-to-internal traffic unconditionally and replace it with a
      default-deny policy plus an explicit allow for the one legitimate path.
