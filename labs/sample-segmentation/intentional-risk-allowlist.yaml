lab_id: sample-segmentation

intentional_findings:
  - id: sample-segmentation-open-proxy
    tool: semgrep
    files:
      - proxy.env.vulnerable
    patterns:
      - PROXY_MODE=open
    reason: The open forwarding mode is the isolated synthetic teaching vulnerability students identify and remediate; it exposes the internal backend path across the network boundary.
  - id: sample-segmentation-internal-marker
    tool: gitleaks
    files:
      - internal-backend.py
    patterns:
      - sample-demo-internal-marker
    reason: This clearly marked synthetic string stands in for internal-only data and supports the segmentation objective check; it has no value outside the isolated lab.
