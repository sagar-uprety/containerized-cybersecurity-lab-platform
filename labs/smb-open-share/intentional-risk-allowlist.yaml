lab_id: smb-open-share

intentional_findings:
  - id: smb-dummy-seed-secrets
    tool: gitleaks
    files:
      - setup-smb.sh
    patterns:
      - demo-backup-pass-2024
      - demo-db-pass-2024
      - demo-prod-db-pass-2024
      - demo-api-key-DEADBEEF2024
      - demo-grafana-tmp-2024
    reason: >
      Dummy SMB share seed files contain obviously fake credentials and
      connection strings so students can enumerate realistic-looking
      sensitive data without exposing real secrets. All values carry
      "demo" markers and reference internal-only hostnames.

  - id: smb-demo-solution-password
    tool: gitleaks
    files:
      - docs/solution-notes.md
    patterns:
      - smb-demo-password
    reason: >
      Instructor-only solution notes use an obvious demo Samba password
      (smb-demo-password) to document the expected smbpasswd remediation
      and the checker's authenticated-access verification path.
