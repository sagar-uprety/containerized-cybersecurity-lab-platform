# Field reference; generate runnable labs from sample-a-standalone.
# Fields marked REQUIRED must be present; others are optional.

# REQUIRED. Lab identifier matching the directory name.
# Pattern: ^[a-z0-9][a-z0-9-]{0,63}$
id: my-new-lab

# REQUIRED. One-line title shown in the portal and documentation.
title: Human-Readable Lab Title

# REQUIRED. Difficulty shown to students.
difficulty: beginner  # beginner | intermediate | advanced

# REQUIRED. Portal outcome without vulnerability details; keep full narrative in docs.
story:
  summary: "Learn to ..."

# REQUIRED. Links to MkDocs guides. Solution notes and instructor guide are
# protected by Nginx instructor authorization.
documentation:
  student_guide_url: /docs/labs/my-new-lab/
  solution_notes_url: /docs/labs/my-new-lab-solution/
  instructor_guide_url: /docs/labs/my-new-lab-instructor/

# ── Access: per-student port allocation ────────────────────────────────
# REQUIRED. Base ports for student-1. Each student gets base + student_number.
# e.g. student01 gets ssh_port_base + 1 = 22001.
access:
  # REQUIRED. SSH port base. Student-1 gets ssh_port_base + 1.
  ssh_port_base: 22000
  # Browser terminal port base (for ttyd). Student-1 gets this + 1.
  browser_terminal_port_base: 19000
  # Application port base (optional). Only needed if a lab-specific app
  # is published to the student. Omit entirely if no app port is needed.
  app_port_base: 18000

# ── Lifecycle: idle and session limits ─────────────────────────────────
# REQUIRED.
lifecycle:
  # Idle timeout in minutes. Null = disabled (used during evaluation sessions).
  idle_timeout_minutes: 30
  # Maximum session length in minutes.
  max_runtime_minutes: 120
  # Evaluation-specific idle timeout (null = use idle_timeout_minutes).
  evaluation_idle_timeout_minutes: null
  # Retention after stop: keep volumes for this long, then remove the instance.
  retention_after_stop_minutes: 180

# ── Checker: portal verification ───────────────────────────────────────
# REQUIRED. Defines how the portal checks whether the lab is fixed.
# Every check runs via `podman exec` into the named container.
checker:
  # REQUIRED. Increment when criterion meaning or checker behavior changes.
  version: 1
  # REQUIRED. The two states every check must define conditions for.
  states:
    - vulnerable
    - fixed
  # REQUIRED. At least one check.
  checks:
    - name: my_check_name           # unique identifier for this check
      label: "Human-readable criterion"
      kind: objective               # objective changes state; guardrail must stay healthy
      exec_in: workstation          # hostname of container to exec into
      run: >-                       # replace with a bounded, deterministic observation
        if grep -qx 'SECURITY_MODE=insecure' /lab/service-config/config.env;
        then echo SAMPLE_VULNERABLE; else echo SAMPLE_FIXED; fi
      states:
        # REQUIRED. Condition that matches when the lab is vulnerable.
        # Format: <operator>:<value>   (see operators below)
        vulnerable: "output_eq: SAMPLE_VULNERABLE"
        # REQUIRED. Condition that matches when the lab is fixed.
        fixed: "output_eq: SAMPLE_FIXED"
        # Operators: output_contains, output_eq, output_ne, exit_code, exit_code_ne.

# ── Build: images to build for this lab ────────────────────────────────
# REQUIRED. At least one image.
build:
  images:
    - service: my-service            # matches a key in services:
      name: thesis-labs/my-service:latest
      context: .                     # build context relative to this lab dir
      dockerfile: Dockerfile         # relative to context
    # Add more images if your lab has multiple custom containers.
    # Shared platform images (workstation-base, lab-service-base) are
    # built separately and referenced in services: by tag.

# ── Services: image registry for each container ────────────────────────
# REQUIRED. Every service that runs in this lab must be declared here.
# The image field is used to resolve the container image at start time.
services:
  workstation:
    image: thesis-labs/workstation-base:latest
    role: Student browser terminal and SSH fallback.
    internal_ports:
      browser_terminal: 19000
      ssh: 22
  my-service:
    image: thesis-labs/my-service:latest
    role: Brief description of what this service does.
    internal_ports:
      http: 8080
      # Add more ports as needed.

# ── Resources: per-service container limits ────────────────────────────
# REQUIRED. Every service declared in services: must have a resource entry.
resources:
  workstation:
    cpus: "0.50"
    memory: "256m"
  my-service:
    cpus: "0.50"
    memory: "256m"

# ── Workstation: lab-specific student terminal config ──────────────────
# REQUIRED. Declare only lab-specific workstation settings; labctl adds platform defaults.
workstation:
  # Lab-specific env vars exposed to the student (e.g. service hostnames).
  # Standard vars (LAB_ID, STUDENT_ID, STUDENT_PASSWORD, TTYD_CREDENTIAL,
  # BROWSER_TERMINAL_PORT) are auto-injected - do not repeat them here.
  environment:
    MY_SERVICE_HOST: my-service
    MY_SERVICE_PORT: "8080"
  # Config volumes shared with service containers. Student edits these
  # at /lab/<target> inside the workstation.
  shared_volumes:
    - name: service_config
      target: /lab/service-config
  # Service hostnames the workstation depends on.
  depends_on:
    - my-service
  # Extra Linux capabilities (optional). NET_RAW is common for nmap.
  cap_add:
    - NET_RAW

# REQUIRED. Declare service containers; labctl generates the workstation.
# Runtime fields and ordering rules are defined in scenario.schema.json.

containers:
  # ── Vulnerable service (the thing the student must fix) ───────────────
  - service: my-service               # must match a key in services:
    hostname: my-service               # DNS name inside the lab network
    init: true
    restart: unless-stopped
    environment:
      # All env vars are strings. Use $platform. tokens for runtime values.
      SERVICE_ADMIN_PASSWORD: "$platform.student_password"
      # Add LAB_* settings supported by platform-images/lab-service-base/entrypoint.sh.
    expose:
      - 8080                          # internal-only ports (not published to host)
    volumes:
      - name: service_data            # logical name - labctl prepends runtime_project_
        target: /data                 # path inside container
      - name: service_config
        target: /etc/service
    # Optional source-tree bind mounts are defined in scenario.schema.json.
    healthcheck:
      command:
        - CMD-SHELL
        - "curl -sf http://127.0.0.1:8080/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    security:
      privileged: false               # NEVER true - platform rejects it
      host_network: false             # NEVER true - platform rejects it
      cap_add: []                     # add only what is strictly needed
      cap_drop:
        - ALL                         # drop everything, then cap_add selectively
    # Optional hardening after verifying every writable path uses a volume:
    # user: "appuser"
    # read_only: true
  # Optional UDP endpoints set ports[].protocol to udp; TCP is the default.
