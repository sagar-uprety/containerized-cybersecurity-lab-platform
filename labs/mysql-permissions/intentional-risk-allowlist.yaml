lab_id: mysql-permissions

intentional_findings:
  - id: mysql-demo-seed-data
    tool: gitleaks
    files:
      - provision.sql
    patterns:
      - "priya.nandakumar@example.com"
    reason: >
      Dummy customer and employee records give students realistic-looking
      application and HR data to discover and cross-database access to
      demonstrate. All names, emails, and figures are synthetic and use the
      example.com domain; none reference real people.

  - id: mysql-vulnerable-account-passwords
    tool: gitleaks
    files:
      - provision.sql
    patterns:
      - "app-demo-password"
    reason: >
      The vulnerable baseline intentionally creates a blank-password network
      root account, a passwordless anonymous account, and an over-privileged
      application account with an obvious demo password. These are the
      findings the lab is built to teach; they exist only inside this
      student's isolated Podman network and are removed or rotated as part
      of the expected remediation.

  - id: mysql-demo-solution-passwords
    tool: gitleaks
    files:
      - docs/solution-notes.md
    patterns:
      - "app-demo-password"
    reason: >
      Instructor-only solution notes reference the demo application account
      password to document the expected GRANT/REVOKE and verification
      workflow.

  - id: mysql-demo-app-container-bind
    tool: bandit
    rules:
      - B104
    files:
      - demo-app/app.py
    patterns:
      - 0.0.0.0
    reason: >
      The demo app intentionally binds all interfaces inside the private
      container network so the workstation and checker can reach it.
