id: unpatched-apache-cve
title: "Web Server Vulnerability Mitigation"
difficulty: intermediate

story:
  summary: "Learn to confirm a server runs a vulnerable version, then apply a compensating fix until you can upgrade it."

documentation:
  student_guide_url: /docs/labs/unpatched-apache-cve/
  solution_notes_url: /docs/labs/unpatched-apache-cve-solution/
  instructor_guide_url: /docs/labs/unpatched-apache-cve-instructor/

access:
  ssh_port_base: 34000
  browser_terminal_port_base: 19200

lifecycle:
  idle_timeout_minutes: 30
  max_runtime_minutes: 120
  evaluation_idle_timeout_minutes: null
  retention_after_stop_minutes: 180

checker:
  version: 2
  states:
    - vulnerable
    - fixed
  checks:
    - name: apache_exploit
      label: "Compensating mitigation blocks path traversal"
      kind: objective
      exec_in: workstation
      run: >
        CONF=/lab/apache/httpd.conf; BODY=$(mktemp);
        ACTIVE_CGI=0; ACTIVE_ALIAS=0; ACTIVE_CGI_DIR=0; ROOT_DENIED=0;
        grep -Eq '^[[:space:]]*LoadModule[[:space:]]+cgi_module' "$CONF" && ACTIVE_CGI=1;
        grep -Eq '^[[:space:]]*Alias[[:space:]]+/cgi-bin/' "$CONF" && ACTIVE_ALIAS=1;
        grep -Eq '^[[:space:]]*<Directory[[:space:]]+"/usr/local/apache2/cgi-bin/">' "$CONF" && ACTIVE_CGI_DIR=1;
        sed -n '/^[[:space:]]*<Directory \/>/,/^[[:space:]]*<\/Directory>/p' "$CONF"
        | grep -Eq '^[[:space:]]*Require[[:space:]]+all[[:space:]]+denied' && ROOT_DENIED=1;
        if ! STATUS=$(curl --path-as-is -sS -o "$BODY" -w '%{http_code}'
        --connect-timeout 5 http://apache-host/cgi-bin/.%2e/%2e%2e/%2e%2e/%2e%2e/etc/passwd); then
          rm -f "$BODY"; echo SERVICE_DOWN;
        elif grep -q '^root:' "$BODY"; then
          rm -f "$BODY"; echo EXPLOITABLE;
        elif [ "$STATUS" != 403 ] && [ "$STATUS" != 404 ]; then
          rm -f "$BODY"; echo HTTP_ERROR_$STATUS;
        elif [ "$ACTIVE_CGI" -ne 0 ] || [ "$ACTIVE_ALIAS" -ne 0 ] || [ "$ACTIVE_CGI_DIR" -ne 0 ] || [ "$ROOT_DENIED" -ne 1 ]; then
          rm -f "$BODY"; echo INCOMPLETE_MITIGATION;
        else
          rm -f "$BODY"; echo MITIGATED;
        fi
      states:
        vulnerable: "output_eq: EXPLOITABLE"
        fixed: "output_eq: MITIGATED"
    - name: apache_home
      label: "Apache web server is reachable"
      kind: guardrail
      exec_in: workstation
      run: "if STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 http://apache-host/); then echo \"$STATUS\"; else echo DOWN; fi"
      states:
        vulnerable: "output_eq: 200"
        fixed: "output_eq: 200"

build:
  images:
    - service: apache-host
      name: thesis-labs/unpatched-apache-cve-apache:latest
      context: .
      dockerfile: Dockerfile

services:
  workstation:
    image: thesis-labs/workstation-base:latest
    role: Student browser terminal and SSH fallback.
    internal_ports:
      browser_terminal: 19200
      ssh: 22
  apache-host:
    image: thesis-labs/unpatched-apache-cve-apache:latest
    role: Vulnerable Apache HTTP server.
    internal_ports:
      http: 80

resources:
  workstation:
    cpus: "0.50"
    memory: "256m"
  apache-host:
    cpus: "0.50"
    memory: "256m"

workstation:
  environment:
    APACHE_HOST: apache-host
    APACHE_PORT: "80"
  shared_volumes:
    - name: apache_config
      target: /lab/apache
  depends_on:
    - apache-host
  cap_add:
    - NET_RAW

containers:
  - service: apache-host
    hostname: apache-host
    init: true
    restart: unless-stopped
    environment:
      LAB_ADMIN_USER: apacheadmin
      LAB_CONFIG_SRC: /opt/lab/baseline/httpd.conf
      LAB_CONFIG_DST: /usr/local/apache2/conf/httpd.conf
      LAB_SERVICE_CMD: "/usr/local/apache2/bin/httpd -f /usr/local/apache2/conf/httpd.conf -DFOREGROUND"
      LAB_DATA_DIR: /usr/local/apache2/htdocs
      LAB_DATA_USER: apache
      LAB_LOG_FILE: /usr/local/apache2/logs/error_log
      LAB_SETUP_SCRIPT: /opt/lab/hooks/pre-start.sh
      SERVICE_ADMIN_PASSWORD: "$platform.student_password"
    expose:
      - 80
    volumes:
      - name: apache_config
        target: /usr/local/apache2/conf
      - name: apache_htdocs
        target: /usr/local/apache2/htdocs
    healthcheck:
      command:
        - CMD-SHELL
        - "curl -sf http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security:
      privileged: false
      host_network: false
      cap_add:
        - AUDIT_WRITE
