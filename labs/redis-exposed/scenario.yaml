id: redis-exposed
title: The Exposed Cache
difficulty: beginner
duration_minutes: 90

story:
  role: Junior Linux administrator
  situation: >
    Monitoring noticed direct connections to the order cache service that do
    not appear to come from the application. The order application still works,
    but the cache may be exposed on the internal network.

teaching:
  prerequisites:
    - Basic Linux CLI
    - Basic client-server networking
  learning_objectives:
    - Identify an unauthenticated internal service.
    - Demonstrate data exposure without credentials.
    - Apply Redis authentication or ACL controls.
    - Verify service continuity after hardening.
  misconception_addressed: >
    Students often assume internal services are safe because they are not
    publicly exposed. This lab shows that any internal foothold can expose
    unprotected services.
  real_world_reference: Redis security documentation and exposed Redis incident reporting.

documentation:
  student_guide_url: /docs/labs/redis-exposed/

access:
  primary: browser_terminal
  fallback: ssh
  ssh_port_base: 22000
  app_port_base: 18000
  browser_terminal_port_base: 19000
  endpoint_formulas:
    browser_terminal: "19000 + student_number"
    ssh: "22000 + student_number"
    app: "18000 + student_number"

lifecycle:
  start_mode: on_demand
  idle_timeout_minutes: 30
  max_runtime_minutes: 120
  evaluation_idle_timeout_minutes: null
  stopped_retention_minutes: 60
  auto_destroy_after_minutes: 180
  student_actions:
    - start
    - stop
    - reset
    - end
    - check

checker:
  command: checks/check.py
  output: json
  states:
    - vulnerable
    - fixed
    - broken

services:
  workstation:
    image: thesis-labs/redis-exposed-workstation:latest
    role: Student browser terminal and SSH fallback environment.
    internal_ports:
      browser_terminal: 19000
      ssh: 22
    tools:
      - redis-cli
      - nmap
      - curl
      - jq
      - vim
      - nano
  redis-host:
    image: thesis-labs/redis-exposed-redis:latest
    role: Vulnerable Redis service.
    internal_ports:
      redis: 6379
    published_to_host: false
  demo-app:
    image: thesis-labs/redis-exposed-demo-app:latest
    role: Small order app that depends on Redis.
    internal_ports:
      http: 8080

initial_state:
  redis:
    bind: "0.0.0.0"
    protected_mode: false
    authentication: none
    reachable_from:
      - workstation
      - demo-app
    host_port_published: false
  demo_app:
    requires_redis_credentials: false
    expected_health_path: /health
  fake_data:
    - session:alice
    - session:bob
    - cart:1001
    - cart:1002
    - feature_flag:admin_mode
    - support_token:demo-only-token

expected_fix:
  redis:
    authentication: requirepass_for_poc_or_acl_for_final
    unauthenticated_commands_fail: true
    host_port_published: false
  demo_app:
    remains_healthy: true
    uses_configured_redis_credentials: true

resources:
  workstation:
    cpus: "0.50"
    memory: "256m"
  redis-host:
    cpus: "0.50"
    memory: "256m"
  demo-app:
    cpus: "0.50"
    memory: "256m"

safety:
  container_runtime_socket_mount: false
  privileged: false
  host_network: false
  publish_vulnerable_service: false
  browser_terminal:
    adapter: ttyd
    credential_required: true
    writable: true
    max_clients: 1
    url_arguments_allowed: false
    once_requires_supervised_restart: true

hints:
  - hints/hint-1.txt
  - hints/hint-2.txt
  - hints/hint-3.txt

artifacts:
  student_guide: student-guide.md
  instructor_guide: instructor-guide.md
  solution_notes: solution-notes.md
  sitrep: files/SITREP.txt
  reflection_template: files/REFLECTION.md
  fixed_config_example: files/redis.conf.fixed.example
