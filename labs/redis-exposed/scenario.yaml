id: redis-exposed
title: The Exposed Cache
difficulty: beginner
duration_minutes: 90

story:
  role: Junior Linux administrator
  situation: >
    Monitoring noticed direct connections to the order cache service that do
    not appear to come from the application. The order application still works,
    but the cache may be exposed on the internal network.

documentation:
  student_guide_url: /docs/labs/redis-exposed/

access:
  ssh_port_base: 22000
  app_port_base: 18000
  browser_terminal_port_base: 19000

lifecycle:
  idle_timeout_minutes: 30
  max_runtime_minutes: 120
  evaluation_idle_timeout_minutes: null
  auto_destroy_after_minutes: 180

checker:
  states:
    - vulnerable
    - fixed
    - broken
  checks:
    - name: redis_unauth_blocked
      exec_in: workstation
      run: "redis-cli -h redis-host ping 2>&1"
      states:
        vulnerable: "output_contains: PONG"
        fixed: "output_contains: NOAUTH"
        broken: "exit_code_ne: 0"
    - name: demo_app_healthy
      exec_in: workstation
      run: "curl -s -o /dev/null -w '%{http_code}' http://demo-app:8080/health"
      states:
        vulnerable: "output_eq: 200"
        fixed: "output_eq: 200"
        broken: "output_ne: 200"

build:
  images:
    - service: redis-host
      name: thesis-labs/redis-exposed-redis:latest
      context: .
      dockerfile: Dockerfile
    - service: demo-app
      name: thesis-labs/redis-exposed-demo-app:latest
      context: .
      dockerfile: demo-app/Dockerfile

services:
  workstation:
    image: thesis-labs/workstation-base:latest
    role: Student browser terminal and SSH fallback.
    internal_ports:
      browser_terminal: 19000
      ssh: 22
  redis-host:
    image: thesis-labs/redis-exposed-redis:latest
    role: Vulnerable Redis service.
    internal_ports:
      redis: 6379
  demo-app:
    image: thesis-labs/redis-exposed-demo-app:latest
    role: Small order app that depends on Redis.
    internal_ports:
      http: 8080

resources:
  workstation:
    cpus: "0.50"
    memory: "256m"
  redis-host:
    cpus: "0.50"
    memory: "256m"
  demo-app:
    cpus: "0.50"
    memory: "256m"

# Lab-specific workstation configuration.
# The full workstation container is auto-generated by labctl from this section.
# Only lab-specific pieces are declared here — platform boilerplate is handled automatically.
workstation:
  environment:
    REDIS_HOST: redis-host
    REDIS_PORT: "6379"
    DEMO_APP_URL: "http://demo-app:8080"
  shared_volumes:
    - name: redis_config
      target: /lab/redis
    - name: app_config
      target: /lab/demo-app
  depends_on:
    - redis-host
    - demo-app

# Service container topology for this lab.
# Values prefixed with $platform. are resolved at runtime by labctl.
# Named volumes use logical names (no prefix); labctl prepends runtime_project_ automatically.
containers:
  - service: redis-host
    hostname: redis-host
    init: true
    restart: unless-stopped
    environment:
      LAB_ADMIN_USER: redisadmin
      LAB_CONFIG_SRC: /opt/lab/baseline/redis.conf
      LAB_CONFIG_DST: /usr/local/etc/redis/redis.conf
      LAB_SERVICE_CMD: "redis-server /usr/local/etc/redis/redis.conf --logfile /var/log/redis-server.log"
      LAB_DATA_DIR: /data
      LAB_DATA_USER: redis
      LAB_SEED_FILE: /opt/lab/seed/seed.txt
      LAB_SEED_CMD: "redis-cli -h 127.0.0.1"
      LAB_LOG_FILE: /var/log/redis-server.log
      SERVICE_ADMIN_PASSWORD: "$platform.student_password"
    expose:
      - 6379
    volumes:
      - name: redis_data
        target: /data
      - name: redis_config
        target: /usr/local/etc/redis
    healthcheck:
      command:
        - CMD-SHELL
        - "redis-cli -h 127.0.0.1 ping 2>&1 | grep -Eq 'PONG|NOAUTH|WRONGPASS'"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    security:
      no_new_privileges: true
      privileged: false
      host_network: false
      cap_add:
        - AUDIT_WRITE

  - service: demo-app
    hostname: demo-app
    init: true
    restart: unless-stopped
    user: "appuser"
    read_only: true
    environment:
      REDIS_HOST: redis-host
      REDIS_PORT: "6379"
      APP_CONFIG_FILE: /app/config/app-config.env
    ports:
      - host_ip: "$platform.host_bind_ip"
        host_port: "$platform.app_port"
        container_port: 8080
    volumes:
      - name: app_config
        target: /app/config
    depends_on:
      - redis-host
    healthcheck:
      command:
        - CMD-SHELL
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)\""
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security:
      no_new_privileges: true
      privileged: false
      host_network: false
      cap_drop:
        - ALL
