id: redis-exposed
title: The Exposed Cache
difficulty: beginner
duration_minutes: 90

story:
  role: Junior Linux administrator
  situation: >
    Monitoring noticed direct connections to the order cache service that do
    not appear to come from the application. The order application still works,
    but the cache may be exposed on the internal network.

documentation:
  student_guide_url: /docs/labs/redis-exposed/

access:
  primary: browser_terminal
  fallback: ssh
  ssh_port_base: 22000
  app_port_base: 18000
  browser_terminal_port_base: 19000

lifecycle:
  start_mode: on_demand
  idle_timeout_minutes: 30
  max_runtime_minutes: 120
  evaluation_idle_timeout_minutes: null
  stopped_retention_minutes: 60
  auto_destroy_after_minutes: 180
  student_actions:
    - start
    - stop
    - reset
    - end
    - check

checker:
  states:
    - vulnerable
    - fixed
    - broken
  checks:
    - name: redis_unauth_blocked
      exec_in: workstation
      run: "redis-cli -h redis-host ping 2>&1"
      states:
        vulnerable: "output_contains: PONG"
        fixed: "output_contains: NOAUTH"
        broken: "exit_code_ne: 0"
    - name: demo_app_healthy
      exec_in: workstation
      run: "curl -s -o /dev/null -w '%{http_code}' http://demo-app:8080/health"
      states:
        vulnerable: "output_eq: 200"
        fixed: "output_eq: 200"
        broken: "output_ne: 200"

build:
  images:
    - service: redis-host
      name: thesis-labs/redis-exposed-redis:latest
      context: .
      dockerfile: Dockerfile
    - service: demo-app
      name: thesis-labs/redis-exposed-demo-app:latest
      context: .
      dockerfile: demo-app/Dockerfile

services:
  workstation:
    image: thesis-labs/workstation-base:latest
    role: Student browser terminal and SSH fallback.
    internal_ports:
      browser_terminal: 19000
      ssh: 22
  redis-host:
    image: thesis-labs/redis-exposed-redis:latest
    role: Vulnerable Redis service.
    internal_ports:
      redis: 6379
    published_to_host: false
  demo-app:
    image: thesis-labs/redis-exposed-demo-app:latest
    role: Small order app that depends on Redis.
    internal_ports:
      http: 8080

resources:
  workstation:
    cpus: "0.50"
    memory: "256m"
  redis-host:
    cpus: "0.50"
    memory: "256m"
  demo-app:
    cpus: "0.50"
    memory: "256m"

safety:
  container_runtime_socket_mount: false
  privileged: false
  host_network: false
  publish_vulnerable_service: false
  browser_terminal:
    adapter: ttyd
    credential_required: true
    writable: true
    max_clients: 2
    url_arguments_allowed: false
    once_requires_supervised_restart: true
