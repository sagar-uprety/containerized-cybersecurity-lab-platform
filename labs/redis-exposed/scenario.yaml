id: redis-exposed
title: "In-Memory Cache Access Control"
difficulty: beginner

story:
  role: Junior Linux administrator
  situation: >
    Monitoring noticed direct connections to the order cache service that do
    not appear to come from the application. The order application still works,
    but the cache may be exposed on the internal network.

documentation:
  student_guide_url: /docs/labs/redis-exposed/
  solution_notes_url: /docs/labs/redis-exposed-solution/
  instructor_guide_url: /docs/labs/redis-exposed-instructor/

access:
  ssh_port_base: 22000
  app_port_base: 18000
  browser_terminal_port_base: 19000

lifecycle:
  idle_timeout_minutes: 30
  max_runtime_minutes: 120
  evaluation_idle_timeout_minutes: null
  retention_after_stop_minutes: 180

checker:
  version: 2
  states:
    - vulnerable
    - fixed
  checks:
    - name: redis_unauth_blocked
      label: "Unauthorized Redis access is blocked"
      kind: objective
      exec_in: redis-host
      run: >-
        response=$(redis-cli -h 127.0.0.1 ping 2>&1);
        if printf '%s\n' "$response" | grep -qx PONG; then
          echo unauth_allowed;
        elif printf '%s\n' "$response" | grep -q NOAUTH; then
          echo unauth_blocked;
        else
          echo unauth_unexpected;
        fi
      states:
        vulnerable: "output_eq: unauth_allowed"
        fixed: "output_eq: unauth_blocked"
    - name: redis_bind_restricted
      label: "Redis is unreachable from the client network"
      kind: objective
      exec_in: workstation
      run: >-
        response=$(redis-cli -h redis-host ping 2>&1);
        if printf '%s\n' "$response" | grep -qx PONG; then
          echo client_network_exposed;
        elif printf '%s\n' "$response" | grep -q 'Could not connect'; then
          echo client_network_restricted;
        else
          echo client_network_unexpected;
        fi
      states:
        vulnerable: "output_eq: client_network_exposed"
        fixed: "output_eq: client_network_restricted"
    - name: app_least_privilege
      label: "Application reads continue and writes are denied"
      kind: objective
      exec_in: workstation
      run: "curl -fsS http://demo-app:8080/security-check"
      states:
        vulnerable: "output_eq: read=false write=allowed"
        fixed: "output_eq: read=false write=denied"
    - name: redis_admin_access
      label: "Redis administrator can authenticate and administer data"
      kind: objective
      exec_in: redis-host
      run: >-
        result=$(REDISCLI_AUTH=admin-demo-password redis-cli -h 127.0.0.1
        --user admin --raw ACL WHOAMI 2>/dev/null);
        if [ "$result" = admin ] &&
        REDISCLI_AUTH=admin-demo-password redis-cli -h 127.0.0.1 --user admin
        SET checker:admin-write ok >/dev/null 2>&1 &&
        [ "$(REDISCLI_AUTH=admin-demo-password redis-cli -h 127.0.0.1
        --user admin --raw GET checker:admin-write 2>/dev/null)" = ok ]; then
        REDISCLI_AUTH=admin-demo-password redis-cli -h 127.0.0.1 --user admin
        DEL checker:admin-write >/dev/null 2>&1;
        echo admin_operational;
        else
        echo admin_unavailable;
        fi
      states:
        vulnerable: "output_eq: admin_unavailable"
        fixed: "output_eq: admin_operational"
    - name: redis_runtime_config
      label: "Restarted Redis uses the hardened runtime configuration"
      kind: objective
      exec_in: redis-host
      run: >-
        vulnerable_bind=$(redis-cli -h 127.0.0.1 --raw CONFIG GET bind
        2>/dev/null | sed -n '2p');
        fixed_bind=$(REDISCLI_AUTH=admin-demo-password redis-cli -h 127.0.0.1
        --user admin --raw CONFIG GET bind 2>/dev/null | sed -n '2p');
        aclfile=$(REDISCLI_AUTH=admin-demo-password redis-cli -h 127.0.0.1
        --user admin --raw CONFIG GET aclfile 2>/dev/null | sed -n '2p');
        if [ "$vulnerable_bind" = 0.0.0.0 ]; then
          echo runtime_vulnerable;
        elif [ "$fixed_bind" = 'redis-app 127.0.0.1' ] &&
        [ "$aclfile" = /usr/local/etc/redis/users.acl ]; then
          echo runtime_hardened;
        else
          echo runtime_unexpected;
        fi
      states:
        vulnerable: "output_eq: runtime_vulnerable"
        fixed: "output_eq: runtime_hardened"
    - name: demo_app_behavior
      label: "Demo application reads expected cache data"
      kind: guardrail
      exec_in: workstation
      run: >-
        if [ "$(curl -fsS http://demo-app:8080/)" =
        'Order cache is reachable. admin_mode=false' ]; then
          echo app_operational;
        else
          echo app_broken;
        fi
      states:
        vulnerable: "output_eq: app_broken"
        fixed: "output_eq: app_operational"
    - name: demo_app_healthy
      label: "Demo application health check passes"
      kind: guardrail
      exec_in: workstation
      run: >-
        if [ "$(curl -fsS http://demo-app:8080/health)" = ok ]; then
          echo app_healthy;
        else
          echo app_unhealthy;
        fi
      states:
        vulnerable: "output_eq: app_unhealthy"
        fixed: "output_eq: app_healthy"

build:
  images:
    - service: redis-host
      name: thesis-labs/redis-exposed-redis:latest
      context: .
      dockerfile: Dockerfile
    - service: demo-app
      name: thesis-labs/redis-exposed-demo-app:latest
      context: .
      dockerfile: demo-app/Dockerfile

services:
  workstation:
    image: thesis-labs/workstation-base:latest
    role: Student browser terminal and SSH fallback.
    internal_ports:
      browser_terminal: 19000
      ssh: 22
  redis-host:
    image: thesis-labs/redis-exposed-redis:latest
    role: Vulnerable Redis service.
    internal_ports:
      redis: 6379
  demo-app:
    image: thesis-labs/redis-exposed-demo-app:latest
    role: Small order app that depends on Redis.
    internal_ports:
      http: 8080

networks:
  - name: client-net
  - name: app-net

resources:
  workstation:
    cpus: "0.50"
    memory: "256m"
  redis-host:
    cpus: "0.50"
    memory: "256m"
  demo-app:
    cpus: "0.50"
    memory: "256m"

workstation:
  environment:
    REDIS_HOST: redis-host
    REDIS_PORT: "6379"
    DEMO_APP_URL: "http://demo-app:8080"
  shared_volumes:
    - name: redis_config
      target: /lab/redis
    - name: demo_app_config
      target: /lab/demo-app
  depends_on:
    - redis-host
    - demo-app

containers:
  - service: redis-host
    hostname: redis-host
    networks:
      - app-net
      - client-net
    network_aliases:
      - redis-app
    init: true
    restart: unless-stopped
    environment:
      LAB_ADMIN_USER: redisadmin
      LAB_CONFIG_SRC: /opt/lab/baseline/redis.conf
      LAB_CONFIG_DST: /usr/local/etc/redis/redis.conf
      LAB_SERVICE_CMD: "redis-server /usr/local/etc/redis/redis.conf --logfile /var/log/redis-server.log"
      LAB_DATA_DIR: /data
      LAB_DATA_USER: redis
      LAB_SEED_FILE: /opt/lab/seed/seed.txt
      LAB_SEED_CMD: >-
        redis-cli -h 127.0.0.1 ping | grep -qx PONG &&
        redis-cli -h 127.0.0.1
      LAB_LOG_FILE: /var/log/redis-server.log
      SERVICE_ADMIN_PASSWORD: "$platform.student_password"
    expose:
      - 6379
    volumes:
      - name: redis_data
        target: /data
      - name: redis_config
        target: /usr/local/etc/redis
    healthcheck:
      command:
        - CMD-SHELL
        - "redis-cli -h 127.0.0.1 ping 2>&1 | grep -Eq 'PONG|NOAUTH|WRONGPASS'"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    security:
      privileged: false
      host_network: false
      cap_add:
        - AUDIT_WRITE

  - service: demo-app
    hostname: demo-app
    networks:
      - app-net
      - client-net
    init: true
    restart: unless-stopped
    user: "appuser"
    read_only: true
    environment:
      REDIS_HOST: redis-app
      REDIS_PORT: "6379"
    ports:
      - host_ip: "$platform.host_bind_ip"
        host_port: "$platform.app_port"
        container_port: 8080
    volumes:
      - name: demo_app_config
        target: /lab/demo-app
    depends_on:
      - redis-host
    healthcheck:
      command:
        - CMD-SHELL
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)\""
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security:
      privileged: false
      host_network: false
      cap_drop:
        - ALL
