lab_id: redis-exposed

# Intentional findings document teaching-purpose weaknesses. They do not disable
# scanners by themselves; tool suppressions must point back to these IDs.
intentional_findings:
  - id: redis-dummy-seed-token
    tool: gitleaks
    files:
      - seed.txt
    patterns:
      - support_token:demo-only-token
    reason: Dummy Redis seed data gives students realistic keys to enumerate without committing real secrets.

  - id: redis-demo-solution-password
    tool: gitleaks
    files:
      - docs/solution-notes.md
    patterns:
      - demo-redis-password
    reason: Instructor solution notes use an obvious demo password to document the expected remediation workflow.

  - id: redis-demo-app-container-bind
    tool: bandit
    rules:
      - B104
    files:
      - demo-app/app.py
    patterns:
      - 0.0.0.0
    reason: The demo app intentionally binds all interfaces inside the private container network for student access.
