lab_id: redis-exposed

intentional_findings:
  - id: redis-dummy-seed-token
    tool: gitleaks
    files:
      - seed.txt
    patterns:
      - support_token:demo-only-token
      - demo-postgresql://fake-svc
    reason: Dummy Redis seed data gives students realistic keys to enumerate without committing real secrets. All connection strings and tokens are obviously fake demo values.

  - id: redis-demo-solution-passwords
    tool: gitleaks
    files:
      - docs/solution-notes.md
    patterns:
      - admin-demo-password
      - app-demo-password
    reason: Instructor solution notes use obvious demo passwords (admin-demo-password, app-demo-password) to document the expected ACL remediation workflow.

  - id: redis-demo-app-container-bind
    tool: bandit
    rules:
      - B104
    files:
      - demo-app/app.py
    patterns:
      - 0.0.0.0
    reason: The demo app intentionally binds all interfaces inside the private container network for student access.
