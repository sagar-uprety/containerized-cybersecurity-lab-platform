id: ssh-weak-config
title: The Server That Logged Someone In
difficulty: intermediate

story:
  role: Incident responder
  situation: >
    A server was flagged after suspicious SSH login activity appeared in the
    authentication logs, and there are signs someone may already have gained
    access. Audit the SSH service, establish how an intruder could get in, and
    harden the server.

documentation:
  student_guide_url: /docs/labs/ssh-weak-config/
  solution_notes_url: /docs/labs/ssh-weak-config-solution/
  instructor_guide_url: /docs/labs/ssh-weak-config-instructor/

access:
  ssh_port_base: 22000
  browser_terminal_port_base: 19000

lifecycle:
  idle_timeout_minutes: 30
  max_runtime_minutes: 120
  evaluation_idle_timeout_minutes: null
  retention_after_stop_minutes: 180

checker:
  version: 2
  states:
    - vulnerable
    - fixed
  checks:
    - name: ssh_password_auth
      label: "Weak password login is rejected by the effective SSH configuration"
      kind: objective
      exec_in: workstation
      run: >-
        if sshpass -p 'demo-ssh-pass' ssh -o StrictHostKeyChecking=no
        -o PreferredAuthentications=password -o PubkeyAuthentication=no
        -o ConnectTimeout=5 lab-user@ssh-host true >/dev/null 2>&1; then
        echo VULN_PASSWORD_ACCEPTED; else echo PASSWORD_REJECTED; fi
      states:
        vulnerable: "output_contains: VULN_PASSWORD_ACCEPTED"
        fixed: "output_contains: PASSWORD_REJECTED"
    - name: ssh_config_valid
      label: "SSH configuration is valid and disables password authentication"
      kind: objective
      exec_in: workstation
      run: >-
        ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5
        -i /lab/keys/lab_key lab-user@ssh-host
        'if sudo sshd -t && sudo sshd -T | grep -q "^passwordauthentication no$";
        then echo CONFIG_OK; else echo VULN_CONFIG; fi'
      states:
        vulnerable: "output_contains: VULN_CONFIG"
        fixed: "output_contains: CONFIG_OK"
    - name: ssh_permit_root_login
      label: "Direct root SSH login is disabled"
      kind: objective
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host 'sudo sshd -t && sudo sshd -T 2>/dev/null | grep -q \"^permitrootlogin no$\" && echo ROOT_OK || echo VULN_ROOT'"
      states:
        vulnerable: "output_contains: VULN_ROOT"
        fixed: "output_contains: ROOT_OK"
    - name: ssh_root_unauthorized_keys
      label: "Root SSH authorized keys are removed"
      kind: objective
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host 'sudo sed -n 1p /root/.ssh/authorized_keys 2>/dev/null | grep -q . && echo ROOT_KEYS_PRESENT || echo ROOT_KEYS_EMPTY'"
      states:
        vulnerable: "output_contains: ROOT_KEYS_PRESENT"
        fixed: "output_contains: ROOT_KEYS_EMPTY"
    - name: ssh_labuser_unauthorized_keys
      label: "Lab user SSH authorized keys are clean"
      kind: objective
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host 'count=$(grep -vE \"^[[:space:]]*$|^#\" ~/.ssh/authorized_keys | wc -l); if [ \"$count\" -eq 1 ]; then echo AUTH_KEYS_CLEAN; else echo AUTH_KEYS_DIRTY; fi'"
      states:
        vulnerable: "output_contains: AUTH_KEYS_DIRTY"
        fixed: "output_contains: AUTH_KEYS_CLEAN"
    - name: ssh_max_auth_tries
      label: "Max SSH authentication attempts is limited"
      kind: objective
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host 'value=$(sudo sshd -T 2>/dev/null | grep \"^maxauthtries \" | cut -d\" \" -f2); if [ -n \"$value\" ] && [ \"$value\" -le 3 ]; then echo TRIES_OK; else echo VULN_TRIES; fi'"
      states:
        vulnerable: "output_contains: VULN_TRIES"
        fixed: "output_contains: TRIES_OK"
    - name: ssh_weak_accounts_locked
      label: "Accounts with planted weak passwords are locked"
      kind: objective
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host 'for user in root lab-user svc-user; do sudo passwd -S \"$user\"; done | grep -vc \" L \" | grep -q ^0$ && echo ACCOUNTS_LOCKED || echo VULN_ACCOUNTS'"
      states:
        vulnerable: "output_contains: VULN_ACCOUNTS"
        fixed: "output_contains: ACCOUNTS_LOCKED"
    - name: ssh_auth_log
      label: "OpenSSH authentication events reach the fail2ban log"
      kind: guardrail
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host 'sudo grep -Eq \"sshd.*(Accepted publickey|Failed password|Connection closed)\" /var/log/auth.log && echo AUTH_LOG_OK || echo AUTH_LOG_MISSING'"
      states:
        vulnerable: "output_contains: AUTH_LOG_OK"
        fixed: "output_contains: AUTH_LOG_OK"
    - name: ssh_fail2ban_effective
      label: "fail2ban consumes SSH logs and performs a safe test ban"
      kind: objective
      exec_in: workstation
      run: >-
        ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5
        -i /lab/keys/lab_key lab-user@ssh-host
        'test_ip=192.0.2.123;
        sudo fail2ban-client set sshd unbanip "$test_ip" >/dev/null 2>&1 || true;
        for attempt in 1 2 3; do
        printf "%s %s sshd[9999]: Failed password for invalid user checker from %s port 4242 ssh2\n"
        "$(date "+%b %e %T")" "$(hostname)" "$test_ip"; done |
        sudo tee -a /var/log/auth.log >/dev/null;
        sleep 3;
        status=$(sudo fail2ban-client status sshd 2>&1 || true);
        if printf "%s\n" "$status" | grep -q "$test_ip"; then
        echo FAIL2BAN_BAN_OBSERVED;
        sudo fail2ban-client set sshd unbanip "$test_ip" >/dev/null;
        else echo FAIL2BAN_NO_BAN; printf "%s\n" "$status"; fi'
      states:
        vulnerable: "output_contains: FAIL2BAN_NO_BAN"
        fixed: "output_contains: FAIL2BAN_BAN_OBSERVED"
    - name: ssh_key_auth
      label: "SSH key authentication works"
      kind: guardrail
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host echo KEY_AUTH_OK 2>&1 || true"
      states:
        vulnerable: "output_contains: KEY_AUTH_OK"
        fixed: "output_contains: KEY_AUTH_OK"

build:
  images:
    - service: ssh-host
      name: thesis-labs/ssh-weak-config-ssh:latest
      context: .
      dockerfile: Dockerfile

services:
  workstation:
    image: thesis-labs/workstation-base:latest
    role: Student browser terminal and SSH fallback.
    internal_ports:
      browser_terminal: 19000
      ssh: 22
  ssh-host:
    image: thesis-labs/ssh-weak-config-ssh:latest
    role: Vulnerable SSH server.
    internal_ports:
      ssh: 22

resources:
  workstation:
    cpus: "0.50"
    memory: "256m"
  ssh-host:
    cpus: "0.50"
    memory: "256m"

workstation:
  environment:
    SSH_HOST: ssh-host
    SSH_PORT: "22"
  shared_volumes:
    - name: ssh_keys
      target: /lab/keys
  depends_on:
    - ssh-host
  cap_add:
    - NET_RAW

containers:
  - service: ssh-host
    hostname: ssh-host
    init: true
    restart: unless-stopped
    environment:
      LAB_ADMIN_USER: root
      LAB_CONFIG_SRC: /opt/lab/baseline/sshd_config
      LAB_CONFIG_DST: /etc/ssh/sshd_config
      LAB_SERVICE_CMD: "sleep infinity"
      LAB_DATA_DIR: /var/run/sshd
      LAB_DATA_USER: root
      LAB_SETUP_SCRIPT: /opt/lab/hooks/pre-start.sh
      LAB_LOG_FILE: /var/log/auth.log
      SERVICE_ADMIN_PASSWORD: "$platform.student_password"
    expose:
      - 22
    volumes:
      - name: ssh_data
        target: /var/lib/ssh
      - name: ssh_keys
        target: /opt/lab/keys
    healthcheck:
      command:
        - CMD-SHELL
        - "ss -tlnp | grep -q ':22 ' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    security:
      privileged: false
      host_network: false
      cap_add:
        - AUDIT_WRITE
        - NET_ADMIN
