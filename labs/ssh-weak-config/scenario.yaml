id: ssh-weak-config
title: Weak SSH Configuration and Brute-Force Vulnerability
difficulty: intermediate

story:
  role: Incident responder
  situation: >
    A server was flagged after suspicious SSH login activity was detected in
    the logs. The previous administrator may have left weak configurations in
    place. Audit the SSH service, determine how attackers could have gained
    access, and harden the server.

documentation:
  student_guide_url: /docs/labs/ssh-weak-config/
  solution_guide_url: /docs/labs/ssh-weak-config-solution/
  instructor_guide_url: /docs/labs/ssh-weak-config-instructor/

access:
  ssh_port_base: 22000
  browser_terminal_port_base: 19000

lifecycle:
  idle_timeout_minutes: 30
  max_runtime_minutes: 120
  evaluation_idle_timeout_minutes: null
  retention_after_stop_minutes: 180

checker:
  states:
    - vulnerable
    - fixed
  checks:
    - name: ssh_password_auth
      label: "Password-based SSH authentication is disabled"
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host 'grep -i ^PasswordAuthentication /etc/ssh/sshd_config 2>&1'"
      states:
        vulnerable: "output_contains: PasswordAuthentication yes"
        fixed: "output_contains: PasswordAuthentication no"
    - name: ssh_fail2ban_active
      label: "SSH brute-force protection is active"
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host 'sudo fail2ban-client status sshd 2>&1 || echo FAIL2BAN_NOT_ACTIVE'"
      states:
        vulnerable: "output_contains: FAIL2BAN_NOT_ACTIVE"
        fixed: "output_contains: Status for the jail:"
    - name: ssh_permit_root_login
      label: "SSH root login is disabled"
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host 'grep -i ^PermitRootLogin /etc/ssh/sshd_config 2>&1 | grep -q yes && echo VULN_ROOT || echo ROOT_OK'"
      states:
        vulnerable: "output_contains: VULN_ROOT"
        fixed: "output_contains: ROOT_OK"
    - name: ssh_root_unauthorized_keys
      label: "Root SSH authorized keys are removed"
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host 'sudo sed -n 1p /root/.ssh/authorized_keys 2>/dev/null | grep -q . && echo ROOT_KEYS_PRESENT || echo ROOT_KEYS_EMPTY'"
      states:
        vulnerable: "output_contains: ROOT_KEYS_PRESENT"
        fixed: "output_contains: ROOT_KEYS_EMPTY"
    - name: ssh_labuser_unauthorized_keys
      label: "Lab user SSH authorized keys are clean"
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host 'count=$(grep -vE \"^[[:space:]]*$|^#\" ~/.ssh/authorized_keys | wc -l); if [ \"$count\" -eq 1 ]; then echo AUTH_KEYS_CLEAN; else echo AUTH_KEYS_DIRTY; fi'"
      states:
        vulnerable: "output_contains: AUTH_KEYS_DIRTY"
        fixed: "output_contains: AUTH_KEYS_CLEAN"
    - name: ssh_max_auth_tries
      label: "Max SSH authentication attempts is limited"
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host 'grep -i ^MaxAuthTries /etc/ssh/sshd_config | grep -q 6 && echo VULN_TRIES || echo TRIES_OK'"
      states:
        vulnerable: "output_contains: VULN_TRIES"
        fixed: "output_contains: TRIES_OK"
    - name: ssh_key_auth
      label: "SSH key authentication works"
      exec_in: workstation
      run: "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i /lab/keys/lab_key lab-user@ssh-host echo KEY_AUTH_OK 2>&1 || true"
      states:
        vulnerable: "output_contains: KEY_AUTH_OK"
        fixed: "output_contains: KEY_AUTH_OK"

build:
  images:
    - service: ssh-host
      name: thesis-labs/ssh-weak-config-ssh:latest
      context: .
      dockerfile: Dockerfile

services:
  workstation:
    image: thesis-labs/workstation-base:latest
    role: Student browser terminal and SSH fallback.
    internal_ports:
      browser_terminal: 19000
      ssh: 22
  ssh-host:
    image: thesis-labs/ssh-weak-config-ssh:latest
    role: Vulnerable SSH server.
    internal_ports:
      ssh: 22

resources:
  workstation:
    cpus: "0.50"
    memory: "256m"
  ssh-host:
    cpus: "0.50"
    memory: "256m"

workstation:
  environment:
    SSH_HOST: ssh-host
    SSH_PORT: "22"
  shared_volumes:
    - name: ssh_keys
      target: /lab/keys
  depends_on:
    - ssh-host
  cap_add:
    - NET_RAW

containers:
  - service: ssh-host
    hostname: ssh-host
    init: true
    restart: unless-stopped
    environment:
      LAB_ADMIN_USER: root
      LAB_CONFIG_SRC: /opt/lab/baseline/sshd_config
      LAB_CONFIG_DST: /etc/ssh/sshd_config
      LAB_SERVICE_CMD: "/usr/sbin/sshd -D -e"
      LAB_DATA_DIR: /var/run/sshd
      LAB_DATA_USER: root
      LAB_SETUP_SCRIPT: /opt/lab/hooks/pre-start.sh
      LAB_LOG_FILE: /var/log/auth.log
      SERVICE_ADMIN_PASSWORD: "$platform.student_password"
    expose:
      - 22
    volumes:
      - name: ssh_data
        target: /var/lib/ssh
      - name: ssh_keys
        target: /opt/lab/keys
    healthcheck:
      command:
        - CMD-SHELL
        - "ss -tlnp | grep -q ':22 ' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    security:
      privileged: false
      host_network: false
      cap_add:
        - AUDIT_WRITE
