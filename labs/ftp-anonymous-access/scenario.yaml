id: ftp-anonymous-access
title: "FTP File Transfer Access Control"
difficulty: beginner

story:
  summary: "Learn to find an FTP server allowing anonymous access, then require authenticated, encrypted connections."

documentation:
  student_guide_url: /docs/labs/ftp-anonymous-access/
  solution_notes_url: /docs/labs/ftp-anonymous-access-solution/
  instructor_guide_url: /docs/labs/ftp-anonymous-access-instructor/

access:
  ssh_port_base: 22000
  browser_terminal_port_base: 19000

lifecycle:
  idle_timeout_minutes: 30
  max_runtime_minutes: 120
  evaluation_idle_timeout_minutes: null
  retention_after_stop_minutes: 180

checker:
  version: 2
  states:
    - vulnerable
    - fixed
  checks:
    - name: ftp_anonymous_read_blocked
      label: "Anonymous FTP directory listing is blocked"
      kind: objective
      exec_in: workstation
      run: >-
        curl -s -m 5 'ftp://ftp-host/' >/dev/null 2>&1; ec=$?;
        if [ "$ec" -eq 0 ]; then echo ANON_READ_OK;
        elif [ "$ec" -eq 67 ]; then echo ANON_BLOCKED;
        else echo "ANON_UNKNOWN_ec$ec"; fi
      states:
        vulnerable: "output_eq: ANON_READ_OK"
        fixed: "output_eq: ANON_BLOCKED"
    - name: ftp_anonymous_upload_blocked
      label: "Anonymous FTP upload is blocked"
      kind: objective
      exec_in: workstation
      run: >-
        printf 'checker upload probe\n' > /tmp/checker-upload.txt;
        curl -s -m 5 -T /tmp/checker-upload.txt ftp://ftp-host/pub/checker-upload.txt
        >/dev/null 2>&1; ec=$?;
        curl -s -m 5 -Q 'DELE pub/checker-upload.txt' ftp://ftp-host/ >/dev/null 2>&1 || true;
        rm -f /tmp/checker-upload.txt;
        if [ "$ec" -eq 0 ]; then echo ANON_UPLOAD_OK;
        elif [ "$ec" -eq 67 ] || [ "$ec" -eq 9 ]; then echo ANON_UPLOAD_BLOCKED;
        else echo "ANON_UPLOAD_UNKNOWN_ec$ec"; fi
      states:
        vulnerable: "output_eq: ANON_UPLOAD_OK"
        fixed: "output_eq: ANON_UPLOAD_BLOCKED"
    - name: ftp_named_login_requires_tls
      label: "Named-user login over plaintext FTP is rejected"
      kind: objective
      exec_in: workstation
      run: >-
        curl -s -m 5 'ftp://ftpuser:ftp-demo-password@ftp-host/' >/dev/null 2>&1; ec=$?;
        if [ "$ec" -eq 0 ]; then echo PLAINTEXT_LOGIN_OK;
        elif [ "$ec" -eq 67 ]; then echo PLAINTEXT_LOGIN_BLOCKED;
        else echo "PLAINTEXT_UNKNOWN_ec$ec"; fi
      states:
        vulnerable: "output_eq: PLAINTEXT_LOGIN_OK"
        fixed: "output_eq: PLAINTEXT_LOGIN_BLOCKED"
    - name: ftp_named_login_tls_works
      label: "Named-user login over encrypted FTP succeeds"
      kind: objective
      exec_in: workstation
      run: >-
        curl -s -m 5 --ssl-reqd -k 'ftp://ftpuser:ftp-demo-password@ftp-host/'
        >/dev/null 2>&1; ec=$?;
        if [ "$ec" -eq 0 ]; then echo TLS_LOGIN_OK; else echo TLS_LOGIN_UNAVAILABLE; fi
      states:
        vulnerable: "output_eq: TLS_LOGIN_UNAVAILABLE"
        fixed: "output_eq: TLS_LOGIN_OK"
    - name: ftp_config_hardened
      label: "Effective vsftpd configuration disables anonymous access and requires encryption"
      kind: objective
      exec_in: ftp-host
      run: >-
        CONF=/etc/vsftpd/vsftpd.conf;
        if grep -qiE '^\s*anonymous_enable\s*=\s*YES' "$CONF" 2>/dev/null; then
          echo CONFIG_VULNERABLE;
        elif grep -qiE '^\s*anonymous_enable\s*=\s*NO' "$CONF" 2>/dev/null &&
        grep -qiE '^\s*ssl_enable\s*=\s*YES' "$CONF" 2>/dev/null &&
        grep -qiE '^\s*force_local_logins_ssl\s*=\s*YES' "$CONF" 2>/dev/null; then
          echo CONFIG_HARDENED;
        else
          echo CONFIG_PARTIAL;
        fi
      states:
        vulnerable: "output_eq: CONFIG_VULNERABLE"
        fixed: "output_eq: CONFIG_HARDENED"
    - name: ftp_service_up
      label: "FTP service is listening on port 21"
      kind: guardrail
      exec_in: workstation
      run: "if nc -z -w3 ftp-host 21 2>/dev/null; then echo FTP_UP; else echo FTP_DOWN; fi"
      states:
        vulnerable: "output_eq: FTP_UP"
        fixed: "output_eq: FTP_UP"

build:
  images:
    - service: ftp-host
      name: thesis-labs/ftp-anonymous-access-ftp:latest
      context: .
      dockerfile: Dockerfile
    - service: workstation
      name: thesis-labs/ftp-anonymous-access-ws:latest
      context: .
      dockerfile: Dockerfile.workstation

services:
  workstation:
    image: thesis-labs/ftp-anonymous-access-ws:latest
    role: Student browser terminal and SSH fallback, with packet capture tooling.
    internal_ports:
      browser_terminal: 19000
      ssh: 22
  ftp-host:
    image: thesis-labs/ftp-anonymous-access-ftp:latest
    role: Vulnerable FTP service.
    internal_ports:
      ftp: 21

resources:
  workstation:
    cpus: "0.50"
    memory: "256m"
  ftp-host:
    cpus: "0.50"
    memory: "256m"

workstation:
  environment:
    FTP_HOST: ftp-host
    FTP_PORT: "21"
  shared_volumes:
    - name: ftp_config
      target: /lab/ftp
    - name: ftp_access
      target: /lab/access
  depends_on:
    - ftp-host
  cap_add:
    - NET_RAW

containers:
  - service: ftp-host
    hostname: ftp-host
    init: true
    restart: unless-stopped
    environment:
      LAB_ADMIN_USER: ftpadmin
      LAB_CONFIG_SRC: /opt/lab/baseline/vsftpd.conf
      LAB_CONFIG_DST: /etc/vsftpd/vsftpd.conf
      LAB_SERVICE_CMD: "/usr/sbin/vsftpd /etc/vsftpd/vsftpd.conf"
      LAB_DATA_DIR: /srv/ftp
      LAB_DATA_USER: root
      LAB_SETUP_SCRIPT: /opt/lab/hooks/pre-start.sh
      LAB_LOG_FILE: /var/log/vsftpd.log
      SERVICE_ADMIN_PASSWORD: "$platform.student_password"
    expose:
      - 21
      - 21100
      - 21101
      - 21102
      - 21103
      - 21104
      - 21105
      - 21106
      - 21107
      - 21108
      - 21109
      - 21110
    volumes:
      - name: ftp_data
        target: /srv/ftp
      - name: ftp_config
        target: /etc/vsftpd-staging
      - name: ftp_access
        target: /lab/access
    healthcheck:
      command:
        - CMD-SHELL
        - "pgrep -x vsftpd || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 8s
    security:
      privileged: false
      host_network: false
      cap_add:
        - AUDIT_WRITE
