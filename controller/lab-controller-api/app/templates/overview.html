{% extends "base.html" %}
{% block content %}
<style>
    .labs-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
    }
    .lab-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 1rem;
        min-height: 220px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .lab-meta {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin: 0.75rem 0;
    }
</style>

<h1>Available Labs</h1>

<div class="labs-grid">
{% for lab in labs %}
    <article class="lab-card">
        <div>
            <h2>{{ lab.title }}</h2>
            <div class="lab-meta">
                <span class="badge">{{ lab.difficulty }}</span>
                {% if states and lab.id in states %}
                    <span class="badge {% if states[lab.id] == 'running' %}badge-running{% elif states[lab.id] == 'stopped' %}badge-stopped{% elif states[lab.id] == 'error' %}badge-error{% endif %}">
                        {{ states[lab.id] }}
                    </span>
                {% endif %}
            </div>
            <p>{{ lab.story.situation }}</p>
        </div>
        <a href="/labs/{{ lab.id }}" class="btn btn-primary">Open Lab</a>
    </article>
{% else %}
    <p>No labs configured.</p>
{% endfor %}
</div>
{% endblock %}
