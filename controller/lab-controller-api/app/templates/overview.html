{% extends "base.html" %}
{% block content %}
<h1>Available Labs</h1>

<div class="labs-grid">
{% for lab in labs %}
    <article class="lab-card">
        <div>
            <h2>{{ lab.title }}</h2>
            <div class="lab-meta">
                <span class="badge">{{ lab.difficulty }}</span>
                {% if states and lab.id in states %}
                    <span class="badge {% if states[lab.id] == 'running' %}badge-running{% elif states[lab.id] == 'stopped' %}badge-stopped{% elif states[lab.id] == 'error' %}badge-error{% endif %}">
                        {{ states[lab.id] }}
                    </span>
                {% endif %}
            </div>
            <p>{{ lab.story.situation }}</p>
        </div>
        <a href="/labs/{{ lab.id }}" class="btn btn-primary">Open Lab</a>
    </article>
{% else %}
    <p>No labs configured.</p>
{% endfor %}
</div>
{% endblock %}
