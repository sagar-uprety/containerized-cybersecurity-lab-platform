<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thesis Lab Portal</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f6f8;
            --surface: #ffffff;
            --surface-2: #eef2f5;
            --ink: #1f2933;
            --muted: #607080;
            --line: #cfd7df;
            --blue: #235c9f;
            --green: #26734d;
            --red: #ad2f2f;
            --amber: #b06b00;
            --terminal: #101418;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.45;
        }
        .header {
            min-height: 56px;
            background: #26323c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.75rem 1.25rem;
        }
        .brand {
            font-weight: 700;
            letter-spacing: 0;
        }
        .userbar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: flex-end;
            font-size: 0.95rem;
        }
        .container {
            width: min(1280px, calc(100vw - 32px));
            margin: 1rem auto;
        }
        h1, h2, h3 { margin: 0 0 0.75rem; line-height: 1.2; letter-spacing: 0; }
        p { margin: 0 0 1rem; }
        a { color: var(--blue); text-decoration: none; }
        a:hover { text-decoration: underline; }
        code {
            background: #eef2f5;
            border: 1px solid #d8e0e7;
            border-radius: 4px;
            padding: 0.1rem 0.3rem;
            font-size: 0.95em;
        }
        pre {
            background: #111820;
            color: #f3f7fb;
            border-radius: 6px;
            padding: 0.75rem;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 1rem 0;
        }
        .btn {
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 0.45rem 0.8rem;
            font-size: 0.95rem;
            font-weight: 650;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn:hover { text-decoration: none; filter: brightness(0.96); }
        .btn-primary { background: var(--blue); }
        .btn-danger { background: var(--red); }
        .btn-warning { background: var(--amber); }
        .btn-success { background: var(--green); }
        .btn-quiet {
            color: var(--ink);
            background: var(--surface-2);
            border-color: var(--line);
        }
        .btn-small {
            min-height: 30px;
            padding: 0.25rem 0.55rem;
            font-size: 0.85rem;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 0.15rem 0.45rem;
            border-radius: 999px;
            background: #e7ecf2;
            color: var(--ink);
            font-size: 0.82rem;
            font-weight: 700;
        }
        .badge-running { background: #d9f0e3; color: #195c3c; }
        .badge-stopped { background: #fff0d7; color: #805000; }
        .badge-error { background: #f8d8d8; color: #8f2424; }
        .action-form { display: inline-flex; margin: 0; }
        .table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }
        .table th, .table td {
            border-bottom: 1px solid var(--line);
            padding: 0.65rem 0.75rem;
            text-align: left;
            vertical-align: top;
        }
        .table tr:last-child td { border-bottom: 0; }
        .muted { color: var(--muted); }
        @media (max-width: 760px) {
            .header { align-items: flex-start; flex-direction: column; }
            .userbar { justify-content: flex-start; }
            .container { width: min(100vw - 20px, 1280px); }
            .btn { width: 100%; }
            .action-form { width: 100%; }
            .toolbar { align-items: stretch; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="brand">Thesis Lab Portal</div>
        <div class="userbar">
            <span>{{ user.username }} ({{ user.role }})</span>
            {% if user.role == "admin" %}
                <a class="btn btn-small btn-quiet" href="/instructor">Instructor</a>
            {% endif %}
            <form action="/logout" method="post" class="action-form">
                <button class="btn btn-small btn-quiet" type="submit">Logout</button>
            </form>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
