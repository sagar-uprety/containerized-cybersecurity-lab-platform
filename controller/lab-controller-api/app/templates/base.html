<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thesis Lab Portal</title>
    <link href="{{ url_for('static', path='/app.css') }}" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="brand">Thesis Lab Portal</div>
        <div class="userbar">
            <span>{{ user.username }} ({{ user.role }})</span>
            {% if user.role == "instructor" %}
                <a class="btn btn-small btn-quiet" href="/instructor">Instructor</a>
            {% endif %}
            <form action="/logout" method="post" class="action-form">
                <button class="btn btn-small btn-quiet" type="submit">Logout</button>
            </form>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
