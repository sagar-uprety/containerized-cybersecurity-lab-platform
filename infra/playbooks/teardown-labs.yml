---
- name: Remove generated lab instances and runtime artifacts
  hosts: lab_workers
  become: true
  tasks:
    - name: Discover thesis lab pods by label
      ansible.builtin.command:
        argv:
          - podman
          - pod
          - ps
          - -a
          - --filter
          - label=thesis.platform={{ thesis_platform_name }}
          - --format
          - "{{ '{{' }}.ID{{ '}}' }}"
      register: thesis_lab_pod_ids
      changed_when: false
      failed_when: false

    - name: Remove discovered thesis lab pods
      ansible.builtin.command:
        argv:
          - podman
          - pod
          - rm
          - -f
          - "{{ item }}"
      loop: "{{ thesis_lab_pod_ids.stdout_lines | default([]) }}"
      when: item | length > 0

    - name: Discover thesis lab containers by label
      ansible.builtin.command:
        argv:
          - podman
          - ps
          - -a
          - --filter
          - label=thesis.platform={{ thesis_platform_name }}
          - --format
          - "{{ '{{' }}.ID{{ '}}' }}"
      register: thesis_lab_container_ids
      changed_when: false
      failed_when: false

    - name: Remove discovered thesis lab containers
      ansible.builtin.command:
        argv:
          - podman
          - rm
          - -f
          - "{{ item }}"
      loop: "{{ thesis_lab_container_ids.stdout_lines | default([]) }}"
      when: item | length > 0

    - name: Discover thesis lab volumes by label
      ansible.builtin.command:
        argv:
          - podman
          - volume
          - ls
          - --filter
          - label=thesis.platform={{ thesis_platform_name }}
          - --format
          - "{{ '{{' }}.Name{{ '}}' }}"
      register: thesis_lab_volume_names
      changed_when: false
      failed_when: false

    - name: Remove discovered thesis lab volumes
      ansible.builtin.command:
        argv:
          - podman
          - volume
          - rm
          - -f
          - "{{ item }}"
      loop: "{{ thesis_lab_volume_names.stdout_lines | default([]) }}"
      when: item | length > 0

    - name: Discover thesis lab networks by label
      ansible.builtin.command:
        argv:
          - podman
          - network
          - ls
          - --filter
          - label=thesis.platform={{ thesis_platform_name }}
          - --format
          - "{{ '{{' }}.Name{{ '}}' }}"
      register: thesis_lab_network_names
      changed_when: false
      failed_when: false

    - name: Remove discovered thesis lab networks
      ansible.builtin.command:
        argv:
          - podman
          - network
          - rm
          - "{{ item }}"
      loop: "{{ thesis_lab_network_names.stdout_lines | default([]) }}"
      when: item | length > 0

    - name: Remove generated lab state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ lab_runtime_rendered_root }}"
        - "{{ lab_runtime_results_root }}"
        - "{{ thesis_state_root }}/tmp"

    - name: Recreate generated lab state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: "{{ thesis_admin_group }}"
        mode: "0750"
      loop:
        - "{{ lab_runtime_rendered_root }}"
        - "{{ lab_runtime_results_root }}"
        - "{{ thesis_state_root }}/tmp"
