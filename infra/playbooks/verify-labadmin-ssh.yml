---
- name: Verify restricted labadmin SSH path from management to worker
  hosts: management
  become: true
  gather_facts: false
  vars:
    labadmin_test_known_hosts_path: /tmp/thesis-labadmin-test-known-hosts
  tasks:
    - name: Require a temporary private key path for SSH verification
      ansible.builtin.assert:
        that:
          - labadmin_test_private_key_path is defined
          - labadmin_test_private_key_path | length > 0
        fail_msg: "Set labadmin_test_private_key_path to the temporary key installed on the management host."

    - name: Check temporary private key exists on management host
      ansible.builtin.stat:
        path: "{{ labadmin_test_private_key_path }}"
      register: labadmin_test_private_key
      changed_when: false

    - name: Assert temporary private key is present
      ansible.builtin.assert:
        that:
          - labadmin_test_private_key.stat.exists
          - labadmin_test_private_key.stat.mode == "0600"

    - name: Run labadmin SSH rejection cases
      ansible.builtin.command:
        argv:
          - ssh
          - -i
          - "{{ labadmin_test_private_key_path }}"
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=no
          - -o
          - UserKnownHostsFile={{ labadmin_test_known_hosts_path }}
          - "{{ thesis_labadmin_user }}@{{ hostvars[groups['lab_workers'][0]].ansible_host }}"
          - "{{ item.command }}"
      loop:
        - name: raw shell
          command: "bash"
          expect: "expected: labctl <verb> <lab_id> <student_id>"
        - name: disallowed verb
          command: "labctl shell redis-exposed student01"
          expect: "verb is not allowed"
        - name: invalid lab id
          command: "labctl status ../redis-exposed student01"
          expect: "invalid lab_id"
        - name: unknown lab id
          command: "labctl status unknown-lab student01"
          expect: "unknown lab_id"
        - name: unknown student id
          command: "labctl status redis-exposed student99"
          expect: "unknown student_id"
        - name: extra argument
          command: "labctl status redis-exposed student01 extra"
          expect: "expected: labctl <verb> <lab_id> <student_id>"
        - name: forbidden bulk cleanup
          command: "labctl destroy-all redis-exposed student01"
          expect: "verb is not allowed"
      register: labadmin_ssh_rejection_checks
      changed_when: false
      failed_when: false

    - name: Assert labadmin SSH path rejects unsafe commands
      ansible.builtin.assert:
        that:
          - item.rc != 0
          - item.item.expect in item.stderr
        fail_msg: "SSH rejection case failed: {{ item.item.name }}"
      loop: "{{ labadmin_ssh_rejection_checks.results }}"
