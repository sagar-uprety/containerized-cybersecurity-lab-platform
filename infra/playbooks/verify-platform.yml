---
- name: Verify common platform baseline without changing hosts
  hosts: platform
  become: true
  gather_facts: true
  tasks:
    - name: Check required platform directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ thesis_common_directories }}"
      register: thesis_common_dir_stats
      changed_when: false

    - name: Assert required platform directories exist
      ansible.builtin.assert:
        that:
          - item.stat.isdir
        fail_msg: "Missing required platform directory: {{ item.item }}"
      loop: "{{ thesis_common_dir_stats.results }}"

- name: Verify lab worker platform baseline without changing hosts
  hosts: lab_workers
  become: true
  tasks:
    - name: Check Podman CLI
      ansible.builtin.command:
        argv:
          - podman
          - --version
      register: podman_version_check
      changed_when: false

    - name: Check Buildah CLI
      ansible.builtin.command:
        argv:
          - buildah
          - --version
      register: buildah_version_check
      changed_when: false

    - name: Check labadmin wrapper
      ansible.builtin.stat:
        path: "{{ thesis_labctl_wrapper_path }}"
      register: labctl_wrapper_check
      changed_when: false

    - name: Check labadmin authorized keys state
      ansible.builtin.stat:
        path: "{{ thesis_labadmin_home }}/.ssh/authorized_keys"
      register: labadmin_authorized_keys_check
      changed_when: false

    - name: Read labadmin authorized keys
      ansible.builtin.slurp:
        path: "{{ thesis_labadmin_home }}/.ssh/authorized_keys"
      register: labadmin_authorized_keys_contents
      changed_when: false
      when: labadmin_authorized_keys_check.stat.exists

    - name: Run labadmin wrapper rejection cases
      ansible.builtin.command:
        argv:
          - "{{ thesis_labctl_wrapper_path }}"
      environment:
        SSH_ORIGINAL_COMMAND: "{{ item.command }}"
      loop:
        - name: empty command
          command: ""
          expect: "expected: labctl <verb> <lab_id> <student_id>"
        - name: raw shell
          command: "bash"
          expect: "expected: labctl <verb> <lab_id> <student_id>"
        - name: disallowed verb
          command: "labctl shell redis-exposed student01"
          expect: "verb is not allowed"
        - name: invalid lab id
          command: "labctl status ../redis-exposed student01"
          expect: "invalid lab_id"
        - name: unknown lab id
          command: "labctl status unknown-lab student01"
          expect: "unknown lab_id"
        - name: unknown student id
          command: "labctl status redis-exposed student99"
          expect: "unknown student_id"
        - name: extra argument
          command: "labctl status redis-exposed student01 extra"
          expect: "expected: labctl <verb> <lab_id> <student_id>"
        - name: forbidden bulk cleanup
          command: "labctl destroy-all redis-exposed student01"
          expect: "verb is not allowed"
      register: labadmin_wrapper_rejection_checks
      changed_when: false
      failed_when: false

    - name: Check lab cleanup timer is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - thesis-lab-cleanup.timer
      register: lab_cleanup_timer_enabled
      changed_when: false

    - name: Check lab cleanup timer is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - thesis-lab-cleanup.timer
      register: lab_cleanup_timer_active
      changed_when: false

    - name: Assert lab worker services are present
      ansible.builtin.assert:
        that:
          - podman_version_check.rc == 0
          - buildah_version_check.rc == 0
          - labctl_wrapper_check.stat.executable
          - labadmin_authorized_keys_check.stat.exists
          - "'command=\"' ~ thesis_labctl_wrapper_path ~ '\"' in (labadmin_authorized_keys_contents.content | b64decode)"
          - "'no-pty,no-agent-forwarding,no-X11-forwarding,no-port-forwarding' in (labadmin_authorized_keys_contents.content | b64decode)"
          - lab_cleanup_timer_enabled.stdout == "enabled"
          - lab_cleanup_timer_active.stdout == "active"

    - name: Assert labadmin wrapper rejects unsafe commands
      ansible.builtin.assert:
        that:
          - item.rc != 0
          - item.item.expect in item.stderr
        fail_msg: "Wrapper rejection case failed: {{ item.item.name }}"
      loop: "{{ labadmin_wrapper_rejection_checks.results }}"

- name: Verify management container tooling without changing hosts
  hosts: management
  become: true
  tasks:
    - name: Check Podman CLI on management host
      ansible.builtin.command:
        argv:
          - podman
          - --version
      register: management_podman_version_check
      changed_when: false

    - name: Check Buildah CLI on management host
      ansible.builtin.command:
        argv:
          - buildah
          - --version
      register: management_buildah_version_check
      changed_when: false

    - name: Assert management container tooling is present
      ansible.builtin.assert:
        that:
          - management_podman_version_check.rc == 0
          - management_buildah_version_check.rc == 0

- name: Verify management platform baseline without changing hosts
  hosts: management
  become: true
  tasks:
    - name: Check management directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ management_directories }}"
      register: management_dir_stats
      changed_when: false

    - name: Check generated controller SSH key files
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - path: "{{ management_controller_ssh_key_path }}"
          mode: "0600"
        - path: "{{ management_controller_ssh_key_path }}.pub"
          mode: "0640"
      register: management_controller_key_stats
      changed_when: false

    - name: Check portal service is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - thesis-portal
      register: management_portal_enabled
      changed_when: false

    - name: Check portal service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - thesis-portal
      register: management_portal_active
      changed_when: false

    - name: Read portal service definition
      ansible.builtin.slurp:
        src: /etc/systemd/system/thesis-portal.service
      register: management_portal_service_definition
      changed_when: false

    - name: Check Nginx service is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - nginx
      register: management_nginx_enabled
      changed_when: false
      when: thesis_portal_nginx_enabled | bool

    - name: Check Nginx service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - nginx
      register: management_nginx_active
      changed_when: false
      when: thesis_portal_nginx_enabled | bool

    - name: Check managed Nginx portal config exists
      ansible.builtin.stat:
        path: /etc/nginx/conf.d/thesis-portal.conf
      register: management_nginx_portal_config
      changed_when: false
      when: thesis_portal_nginx_enabled | bool

    - name: Check SELinux Nginx network proxy boolean
      ansible.builtin.command:
        argv:
          - getsebool
          - httpd_can_network_connect
      register: management_nginx_network_connect
      changed_when: false
      when: thesis_portal_nginx_enabled | bool

    - name: Assert management directories exist
      ansible.builtin.assert:
        that:
          - item.stat.isdir
        fail_msg: "Missing management directory: {{ item.item }}"
      loop: "{{ management_dir_stats.results }}"

    - name: Assert generated controller SSH key files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == item.item.mode
        fail_msg: "Generated controller SSH key file is missing or has wrong mode: {{ item.item.path }}"
      loop: "{{ management_controller_key_stats.results }}"

    - name: Assert portal service and admission-control config are present
      ansible.builtin.assert:
        that:
          - management_portal_enabled.stdout == "enabled"
          - management_portal_active.stdout == "active"
          - >-
            'Environment="SSH_KEY_PATH=' ~ management_controller_ssh_key_path ~ '"'
            in (management_portal_service_definition.content | b64decode)
          - >-
            'Environment="MAX_CONCURRENT_STUDENTS=' ~ thesis_max_concurrent_students ~ '"'
            in (management_portal_service_definition.content | b64decode)
          - "'--host 127.0.0.1 --port 8000' in (management_portal_service_definition.content | b64decode)"

    - name: Assert Nginx proxy service and SELinux network access are ready
      ansible.builtin.assert:
        that:
          - management_nginx_enabled.stdout == "enabled"
          - management_nginx_active.stdout == "active"
          - management_nginx_portal_config.stat.exists
          - management_nginx_network_connect.rc == 0
          - "'--> on' in management_nginx_network_connect.stdout"
      when: thesis_portal_nginx_enabled | bool
