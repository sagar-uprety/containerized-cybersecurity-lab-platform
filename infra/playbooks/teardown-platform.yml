---
- name: Remove thesis platform services and generated host state
  hosts: platform
  become: true
  tasks:
    - name: Stop platform services when present
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - thesis-lab-cleanup.timer
        - thesis-lab-cleanup.service
      failed_when: false

    - name: Stop management services when present
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - thesis-portal
        - nginx
      failed_when: false
      when: inventory_hostname in groups.get("management", [])

    - name: Remove thesis platform systemd units
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - thesis-lab-cleanup.timer
        - thesis-lab-cleanup.service
        - thesis-portal.service

    - name: Remove thesis sudoers and logrotate files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/sudoers.d/thesis-labadmin
        - /etc/logrotate.d/thesis-labs

    - name: Remove thesis helper executables
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ thesis_labctl_wrapper_path }}"
        - /usr/local/sbin/thesis-build-lab-images

    - name: Remove labadmin user and home directory
      ansible.builtin.user:
        name: "{{ thesis_labadmin_user }}"
        state: absent
        remove: true
      when: inventory_hostname in groups.get("lab_workers", [])

    - name: Remove thesis runtime, state, log, and config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ thesis_runtime_root }}"
        - "{{ thesis_state_root }}"
        - "{{ thesis_log_root }}"
        - "{{ thesis_config_root }}"

    - name: Remove nginx thesis portal config
      ansible.builtin.file:
        path: /etc/nginx/conf.d/thesis-portal.conf
        state: absent
      when: inventory_hostname in groups.get("management", [])

    - name: Reload systemd after unit removal
      ansible.builtin.systemd:
        daemon_reload: true
      failed_when: false

    - name: Remove thesis admin group
      ansible.builtin.group:
        name: "{{ thesis_admin_group }}"
        state: absent
