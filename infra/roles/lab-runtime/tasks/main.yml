---
- name: Create lab runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0750"
  loop: "{{ lab_runtime_directories }}"
  tags:
    - lab-source
    - lab-runtime

- name: Create labctl library directory
  ansible.builtin.file:
    path: "{{ thesis_labctl_lib_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - labctl
    - lab-runtime

- name: Discover local lab scenarios
  ansible.builtin.set_fact:
    lab_runtime_scenarios: >-
      {{
        lookup('pipe', 'ls -d ' ~ lab_runtime_local_scenario_root ~ '/*/scenario.yaml 2>/dev/null')
        | default('')
        | split('\n')
        | reject('equalto', '')
        | map('dirname')
        | map('basename')
        | sort
        | list
      }}
  changed_when: false
  tags:
    - lab-source
    - lab-images
    - labadmin

- name: Install lab scenario source trees
  ansible.builtin.copy:
    src: "{{ lab_runtime_local_scenario_root }}/{{ item }}/"
    dest: "{{ lab_runtime_code_root }}/{{ item }}/"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: preserve
    directory_mode: "0750"
  loop: "{{ lab_runtime_scenarios }}"
  register: lab_source_copy_results
  tags:
    - lab-source

- name: Install shared platform image source trees
  ansible.builtin.copy:
    src: "{{ lab_runtime_local_platform_images_root }}/"
    dest: "{{ lab_runtime_platform_images_root }}/"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: preserve
    directory_mode: "0750"
  register: platform_image_source_copy_results
  tags:
    - lab-source
    - lab-images

- name: Create labadmin user
  ansible.builtin.user:
    name: "{{ thesis_labadmin_user }}"
    home: "{{ thesis_labadmin_home }}"
    shell: /bin/bash
    create_home: true
    password_lock: true
    groups: "{{ thesis_admin_group }}"
    append: true
    state: present
  tags:
    - labadmin

- name: Install labadmin student registry
  ansible.builtin.template:
    src: students.txt.j2
    dest: "{{ lab_runtime_student_registry }}"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"

- name: Install lab student credential registry
  ansible.builtin.template:
    src: student-credentials.yml.j2
    dest: "{{ lab_runtime_student_credentials }}"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"

- name: Install lab scenario registry
  ansible.builtin.template:
    src: scenarios.txt.j2
    dest: "{{ lab_runtime_scenario_registry }}"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"

- name: Install lab scenario schema
  ansible.builtin.copy:
    src: "{{ lab_runtime_local_scenario_root }}/templates-contract/scenario.schema.json"
    dest: "{{ lab_runtime_code_root }}/templates-contract/scenario.schema.json"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0644"
  tags:
    - lab-source

- name: Install labctl script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../controller/labctl"
    dest: "{{ thesis_labctl_path }}"
    owner: root
    group: root
    mode: "0755"
  tags:
    - labctl

- name: Install labctl reusable Python package
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../controller/labctl_core/"
    dest: "{{ thesis_labctl_lib_root }}/labctl_core/"
    owner: root
    group: root
    mode: preserve
    directory_mode: "0755"
  tags:
    - labctl

- name: Install restricted labctl SSH wrapper
  ansible.builtin.template:
    src: labctl-ssh-wrapper.py.j2
    dest: "{{ thesis_labctl_wrapper_path }}"
    owner: root
    group: root
    mode: "0755"
  tags:
    - labadmin

- name: Create labadmin SSH directory
  ansible.builtin.file:
    path: "{{ thesis_labadmin_home }}/.ssh"
    state: directory
    owner: "{{ thesis_labadmin_user }}"
    group: "{{ thesis_labadmin_user }}"
    mode: "0700"
  tags:
    - labadmin

- name: Read generated controller public key from management host
  ansible.builtin.slurp:
    src: >-
      {{ hostvars[groups['management'][0]].management_controller_ssh_key_path |
      default(thesis_runtime_root ~ '/controller/controller_key') }}.pub
  delegate_to: "{{ groups['management'][0] }}"
  register: lab_runtime_controller_public_key_file
  changed_when: false
  when:
    - groups['management'] is defined
    - groups['management'] | length > 0
  tags:
    - labadmin

- name: Set generated controller public key for labadmin
  ansible.builtin.set_fact:
    lab_runtime_controller_public_key: "{{ lab_runtime_controller_public_key_file.content | b64decode | trim }}"
  changed_when: false
  when: lab_runtime_controller_public_key_file is not skipped
  tags:
    - labadmin

- name: Assert generated controller public key is available
  ansible.builtin.assert:
    that:
      - lab_runtime_controller_public_key is defined
      - lab_runtime_controller_public_key | length > 0
    fail_msg: "Generated controller public key is unavailable. Run the management play before lab-worker so x02 creates its controller key."
  tags:
    - labadmin

- name: Build restricted labadmin authorized key options
  ansible.builtin.set_fact:
    labadmin_authorized_key_options:
      - command="{{ thesis_labctl_wrapper_path }}"
      - no-pty
      - no-agent-forwarding
      - no-X11-forwarding
      - no-port-forwarding
  changed_when: false
  tags:
    - labadmin

- name: Configure labadmin authorized key for generated controller key
  ansible.builtin.copy:
    content: "{{ labadmin_authorized_key_options | join(',') }} {{ lab_runtime_controller_public_key }}\n"
    dest: "{{ thesis_labadmin_home }}/.ssh/authorized_keys"
    owner: "{{ thesis_labadmin_user }}"
    group: "{{ thesis_labadmin_user }}"
    mode: "0600"
  tags:
    - labadmin

- name: Install least-privilege labadmin sudoers rule
  ansible.builtin.template:
    src: labadmin.sudoers.j2
    dest: /etc/sudoers.d/thesis-labadmin
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags:
    - labadmin

- name: Install lab image build hook
  ansible.builtin.template:
    src: thesis-build-lab-images.py.j2
    dest: /usr/local/sbin/thesis-build-lab-images
    owner: root
    group: root
    mode: "0755"
  tags:
    - lab-images

- name: Check whether lab image sources changed
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/thesis-build-lab-images
      - --changed
  register: lab_runtime_sources_changed_result
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - lab-images

- name: Check lab image cache
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/thesis-build-lab-images
      - --check
  register: lab_runtime_image_presence
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - lab-images

- name: Determine whether lab images need rebuild
  ansible.builtin.set_fact:
    lab_runtime_sources_changed: "{{ lab_runtime_sources_changed_result.rc == 0 }}"
    lab_runtime_images_missing: "{{ lab_runtime_image_presence.rc != 0 }}"
  tags:
    - lab-images

- name: Explain lab image build skipped in check mode
  ansible.builtin.debug:
    msg: "Lab images would be built because source changed or an image is missing, but image builds are skipped in check mode."
  changed_when: false
  when:
    - ansible_check_mode
    - lab_runtime_build_images | bool
    - lab_runtime_sources_changed or lab_runtime_images_missing
  tags:
    - lab-images

- name: Build or refresh lab images
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/thesis-build-lab-images
      - --build
  changed_when: true
  when:
    - not ansible_check_mode
    - lab_runtime_build_images | bool
    - lab_runtime_sources_changed or lab_runtime_images_missing
  tags:
    - lab-images

- name: Prune dangling images after build
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/thesis-build-lab-images
      - --prune
  changed_when: false
  when:
    - not ansible_check_mode
    - lab_runtime_build_images | bool
  tags:
    - lab-images

- name: Check whether lab cleanup timer already exists
  ansible.builtin.stat:
    path: /etc/systemd/system/thesis-lab-cleanup.timer
  register: lab_cleanup_timer_stat
  changed_when: false

- name: Install lab cleanup systemd service
  ansible.builtin.template:
    src: thesis-lab-cleanup.service.j2
    dest: /etc/systemd/system/thesis-lab-cleanup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install lab cleanup systemd timer
  ansible.builtin.template:
    src: thesis-lab-cleanup.timer.j2
    dest: /etc/systemd/system/thesis-lab-cleanup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Explain cleanup timer enable skipped in initial check mode
  ansible.builtin.debug:
    msg: "Skipping cleanup timer enable in check mode because the systemd unit is not present yet; a real run would install it first."
  changed_when: false
  when:
    - ansible_check_mode
    - not lab_cleanup_timer_stat.stat.exists

- name: Enable lab cleanup timer
  ansible.builtin.service:
    name: thesis-lab-cleanup.timer
    state: started
    enabled: true
  when: not ansible_check_mode or lab_cleanup_timer_stat.stat.exists
