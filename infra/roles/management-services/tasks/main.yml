---
- name: Create management service directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0750"
  loop: "{{ management_directories }}"
  tags:
    - portal
    - portal-api
    - portal-ui
    - docs
    - nginx

- name: Install platform portal requirements
  ansible.builtin.pip:
    name:
      - fastapi==0.110.0
      - uvicorn==0.27.1
      - python-multipart==0.0.9
      - pyyaml==6.0.1
      - jsonschema==4.23.0
      - markdown==3.9
      - sqlalchemy==2.0.51
    executable: pip3
  tags:
    - portal
    - portal-api

- name: Install MkDocs requirements
  ansible.builtin.pip:
    name:
      - mkdocs==1.6.1
      - pymdown-extensions==10.12
    executable: pip3
  tags:
    - docs

- name: Install Nginx reverse proxy package
  ansible.builtin.dnf:
    name: nginx
    state: present
  when: thesis_portal_nginx_enabled | bool
  tags:
    - nginx

- name: Add nginx to thesis admin group
  ansible.builtin.user:
    name: nginx
    groups: "{{ thesis_admin_group }}"
    append: true
  when: thesis_portal_nginx_enabled | bool
  notify: Restart nginx
  tags:
    - nginx

- name: Install portal user registry (seed source for first DB init only)
  ansible.builtin.template:
    src: portal-users.yml.j2
    dest: "{{ thesis_config_root }}/portal-users.yml"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"
  notify: Restart thesis portal
  tags:
    - portal
    - portal-api

  ansible.builtin.file:
    path: "{{ thesis_state_root }}"
    state: directory
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0750"
  tags:
    - portal
    - portal-api

- name: Check for existing portal database
  ansible.builtin.stat:
    path: "{{ thesis_state_root }}/portal.db"
  register: _portal_db_stat
  tags:
    - portal
    - portal-api

- name: Back up existing portal database before deploy
  ansible.builtin.copy:
    src: "{{ thesis_state_root }}/portal.db"
    dest: "{{ management_backup_root }}/portal.db.{{ ansible_date_time.iso8601_basic_short }}.bak"
    remote_src: true
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"
  when: _portal_db_stat.stat.exists
  tags:
    - portal
    - portal-api

- name: Find routine portal database backups
  ansible.builtin.find:
    paths: "{{ management_backup_root }}"
    patterns: "portal.db.*.bak"
    age_stamp: mtime
  register: _portal_db_backups
  tags:
    - portal
    - portal-api

- name: Prune routine portal database backups beyond retention count
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (_portal_db_backups.files | sort(attribute='mtime', reverse=true))[thesis_portal_backup_retain_count:] }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - portal
    - portal-api

- name: Check if npm is available locally
  ansible.builtin.command:
    argv: [npm, --version]
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  register: _npm_version
  tags:
    - portal
    - portal-ui

- name: Check if node_modules exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../controller/lab-portal-ui/node_modules/.package-lock.json"
  delegate_to: localhost
  become: false
  register: _node_modules_stat
  tags:
    - portal
    - portal-ui

- name: Check if portal UI dependencies need installing
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../../tools/build_gate.py"
      - --stamp
      - "{{ playbook_dir }}/../../.cache/ansible-build-gate/npm-ci.sha256"
      - check
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/package.json"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/package-lock.json"
  delegate_to: localhost
  become: false
  register: _npm_ci_check
  changed_when: false
  failed_when: false
  tags:
    - portal
    - portal-ui

- name: Install portal UI dependencies
  ansible.builtin.command:
    argv: [npm, ci]
    chdir: "{{ playbook_dir }}/../../controller/lab-portal-ui"
  delegate_to: localhost
  become: false
  register: _npm_ci
  changed_when: true
  when:
    - _npm_version.rc == 0
    - not _node_modules_stat.stat.exists or _npm_ci_check.rc == 0
  tags:
    - portal
    - portal-ui

- name: Record portal UI dependency checksum
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../../tools/build_gate.py"
      - --stamp
      - "{{ playbook_dir }}/../../.cache/ansible-build-gate/npm-ci.sha256"
      - update
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/package.json"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/package-lock.json"
  delegate_to: localhost
  become: false
  changed_when: false
  when: _npm_ci is changed
  tags:
    - portal
    - portal-ui

- name: Check if portal UI SPA needs rebuilding
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../../tools/build_gate.py"
      - --stamp
      - "{{ playbook_dir }}/../../.cache/ansible-build-gate/spa-build.sha256"
      - check
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/src"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/public"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/index.html"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/package.json"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/package-lock.json"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/vite.config.js"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/tsconfig.json"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/components.json"
  delegate_to: localhost
  become: false
  register: _spa_build_check
  changed_when: false
  failed_when: false
  tags:
    - portal
    - portal-ui

- name: Build portal UI (React SPA)
  ansible.builtin.command:
    argv: [npm, run, build]
    chdir: "{{ playbook_dir }}/../../controller/lab-portal-ui"
  delegate_to: localhost
  become: false
  register: _spa_build
  changed_when: _spa_build.rc == 0
  when:
    - _npm_version.rc == 0
    - _spa_build_check.rc == 0
  tags:
    - portal
    - portal-ui

- name: Record portal UI SPA build checksum
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../../tools/build_gate.py"
      - --stamp
      - "{{ playbook_dir }}/../../.cache/ansible-build-gate/spa-build.sha256"
      - update
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/src"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/public"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/index.html"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/package.json"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/package-lock.json"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/vite.config.js"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/tsconfig.json"
      - "{{ playbook_dir }}/../../controller/lab-portal-ui/components.json"
  delegate_to: localhost
  become: false
  changed_when: false
  when: _spa_build is changed
  tags:
    - portal
    - portal-ui

- name: Remove stale SPA bundles before copy
  ansible.builtin.file:
    path: "{{ management_controller_root }}/lab-controller-api/app/static/dist/assets"
    state: absent
  when: _spa_build is changed
  tags:
    - portal
    - portal-ui

- name: Copy portal API code
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../controller/lab-controller-api/"
    dest: "{{ management_controller_root }}/lab-controller-api/"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: preserve
    directory_mode: "0750"
  notify: Restart thesis portal
  tags:
    - portal
    - portal-api
    - portal-ui

- name: Check if portal demo dataset needs regenerating
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../../tools/build_gate.py"
      - --stamp
      - "{{ playbook_dir }}/../../.cache/ansible-build-gate/demo-data.sha256"
      - check
      - "{{ playbook_dir }}/../../tools/generate_portal_demo.py"
      - "{{ playbook_dir }}/../../labs"
  delegate_to: localhost
  become: false
  register: _demo_data_check
  changed_when: false
  failed_when: false
  tags:
    - portal
    - portal-api
    - portal-ui
    - portal-demo-seed

- name: Check if generated demo dataset file exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../controller/lab-controller-api/demo-data.json"
  delegate_to: localhost
  become: false
  register: _demo_data_file_stat
  tags:
    - portal
    - portal-api
    - portal-ui
    - portal-demo-seed

- name: Generate canonical portal demo dataset locally
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../../tools/generate_portal_demo.py"
  delegate_to: localhost
  become: false
  register: _demo_data_gen
  changed_when: true
  when: _demo_data_check.rc == 0 or not _demo_data_file_stat.stat.exists
  tags:
    - portal
    - portal-api
    - portal-ui
    - portal-demo-seed

- name: Record portal demo dataset checksum
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../../tools/build_gate.py"
      - --stamp
      - "{{ playbook_dir }}/../../.cache/ansible-build-gate/demo-data.sha256"
      - update
      - "{{ playbook_dir }}/../../tools/generate_portal_demo.py"
      - "{{ playbook_dir }}/../../labs"
  delegate_to: localhost
  become: false
  changed_when: false
  when: _demo_data_gen is changed
  tags:
    - portal
    - portal-api
    - portal-ui
    - portal-demo-seed

- name: Install canonical portal demo dataset
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../controller/lab-controller-api/demo-data.json"
    dest: "{{ management_controller_root }}/lab-controller-api/demo-data.json"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"
  notify: Restart thesis portal
  tags:
    - portal
    - portal-api
    - portal-demo-seed

- name: Generate targeted domain demo dataset locally
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../../tools/generate_domain_demo.py"
  delegate_to: localhost
  become: false
  changed_when: false
  tags:
    - portal
    - portal-api
    - portal-domain-demo-seed

- name: Install targeted domain demo dataset
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../controller/lab-controller-api/domain-demo-data.json"
    dest: "{{ management_controller_root }}/lab-controller-api/domain-demo-data.json"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"
  notify: Restart thesis portal
  tags:
    - portal
    - portal-api
    - portal-domain-demo-seed

- name: Discover lab scenario directories on controller
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../../labs"
    patterns: scenario.yaml
    recurse: true
    depth: 2
    file_type: file
  delegate_to: localhost
  become: false
  register: management_scenario_files
  changed_when: false
  tags:
    - portal
    - portal-api
    - docs

- name: Set management lab scenario list
  ansible.builtin.set_fact:
    management_lab_scenarios: >-
      {{
        management_scenario_files.files
        | map(attribute='path')
        | map('dirname')
        | map('basename')
        | sort
        | list
      }}
  changed_when: false
  tags:
    - portal
    - portal-api
    - docs

- name: Install lab scenario source trees on management node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../labs/{{ item }}/"
    dest: "{{ management_controller_root }}/lab-controller-api/labs/{{ item }}/"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: preserve
    directory_mode: "0750"
  loop: "{{ management_lab_scenarios }}"
  notify: Restart thesis portal
  tags:
    - portal
    - portal-api
    - docs

- name: Install scenario metadata schema on management node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../labs/templates-contract/scenario.schema.json"
    dest: "{{ management_controller_root }}/lab-controller-api/labs/templates-contract/scenario.schema.json"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"
  notify: Restart thesis portal
  tags:
    - portal
    - portal-api
    - docs

# MkDocs pymdownx.snippets resolves lab guide includes (e.g. "labs/<id>/docs/
# instructor-guide.md") relative to the MkDocs source root, not the portal's
# controller/labs tree copied above. Without this, docs/labs/<id>*.md stubs
# fail snippet resolution on the management node even though they build fine
# locally (repo root already has labs/ next to config/mkdocs.yml).
- name: Install lab doc source trees for MkDocs snippet resolution
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../labs/{{ item }}/docs/"
    dest: "{{ management_docs_root }}/source/labs/{{ item }}/docs/"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: preserve
    directory_mode: "0750"
  loop: "{{ management_lab_scenarios }}"
  notify: Build MkDocs site
  tags:
    - docs

- name: Create MkDocs configuration directory
  ansible.builtin.file:
    path: "{{ management_docs_root }}/source/config"
    state: directory
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0750"
  tags:
    - docs

- name: Install MkDocs configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../config/mkdocs.yml"
    dest: "{{ management_docs_root }}/source/config/mkdocs.yml"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"
  notify: Build MkDocs site
  tags:
    - docs

- name: Remove stale MkDocs source tree
  ansible.builtin.file:
    path: "{{ management_docs_root }}/source/docs"
    state: absent
  notify: Build MkDocs site
  tags:
    - docs

- name: Install MkDocs source tree
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docs/"
    dest: "{{ management_docs_root }}/source/docs/"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: preserve
    directory_mode: "0750"
  notify: Build MkDocs site
  tags:
    - docs

- name: Generate MkDocs lab index from scenarios
  ansible.builtin.template:
    src: mkdocs-index.md.j2
    dest: "{{ management_docs_root }}/source/docs/index.md"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"
  notify: Build MkDocs site
  tags:
    - docs

- name: Install portal systemd service
  ansible.builtin.template:
    src: thesis-portal.service.j2
    dest: /etc/systemd/system/thesis-portal.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart thesis portal
  tags:
    - portal
    - portal-api

- name: Check existing portal database before demo replacement
  ansible.builtin.stat:
    path: "{{ thesis_state_root }}/portal.db"
  register: _portal_db_stat
  when: thesis_portal_demo_replace | bool
  tags:
    - portal
    - portal-demo-seed

- name: Back up existing portal database before demo replacement
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import sqlite3, sys; source = sqlite3.connect(sys.argv[1]); target = sqlite3.connect(sys.argv[2]); source.backup(target); target.close(); source.close()"
      - "{{ thesis_state_root }}/portal.db"
      - "{{ management_backup_root }}/portal.{{ ansible_date_time.iso8601_basic_short }}.db.bak"
  when:
    - thesis_portal_demo_replace | bool
    - _portal_db_stat.stat.exists
  tags:
    - portal
    - portal-demo-seed

- name: Restrict portal database backup
  ansible.builtin.file:
    path: "{{ management_backup_root }}/portal.{{ ansible_date_time.iso8601_basic_short }}.db.bak"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"
  when:
    - thesis_portal_demo_replace | bool
    - _portal_db_stat.stat.exists
  tags:
    - portal
    - portal-demo-seed

- name: Check existing evidence directory before demo replacement
  ansible.builtin.stat:
    path: "{{ thesis_state_root }}/evidence"
  register: _portal_evidence_stat
  when: thesis_portal_demo_replace | bool
  tags:
    - portal
    - portal-demo-seed

- name: Back up existing evidence before demo replacement
  ansible.builtin.copy:
    src: "{{ thesis_state_root }}/evidence"
    dest: "{{ management_backup_root }}/evidence.{{ ansible_date_time.iso8601_basic_short }}.bak"
    remote_src: true
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: preserve
  when:
    - thesis_portal_demo_replace | bool
    - _portal_evidence_stat.stat.exists
  tags:
    - portal
    - portal-demo-seed

- name: Replace portal state with canonical synthetic dataset
  when: thesis_portal_demo_replace | bool
  block:
    - name: Stop portal for explicit demo replacement
      ansible.builtin.systemd:
        name: thesis-portal
        state: stopped
        daemon_reload: true

    - name: Load canonical synthetic dataset
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - app.demo_seed
          - --replace
          - --data
          - "{{ management_controller_root }}/lab-controller-api/demo-data.json"
          - --credentials
          - "{{ thesis_portal_demo_credentials_path }}"
        chdir: "{{ management_controller_root }}/lab-controller-api"
      environment:
        PORTAL_DB_PATH: "{{ thesis_state_root }}/portal.db"
        PORTAL_DEMO_DATA_PATH: "{{ management_controller_root }}/lab-controller-api/demo-data.json"
        EVENT_LOG_PATH: "{{ thesis_portal_event_log }}"
        RESULTS_DIR: "{{ thesis_state_root }}/results"
        LABS_DIR: "{{ management_controller_root }}/lab-controller-api/labs"
      register: _portal_demo_seed
      changed_when: true
  always:
    - name: Ensure portal is running after demo replacement
      ansible.builtin.systemd:
        name: thesis-portal
        state: started
        daemon_reload: true
  tags:
    - portal
    - portal-demo-seed

- name: Ensure local private credential directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../.secrets"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: thesis_portal_demo_replace | bool
  tags:
    - portal
    - portal-demo-seed

- name: Fetch generated demo credentials locally
  ansible.builtin.fetch:
    src: "{{ thesis_portal_demo_credentials_path }}"
    dest: "{{ playbook_dir }}/../../.secrets/portal-demo-credentials.csv"
    flat: true
  when: thesis_portal_demo_replace | bool
  tags:
    - portal
    - portal-demo-seed

- name: Restrict fetched demo credentials locally
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../.secrets/portal-demo-credentials.csv"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: thesis_portal_demo_replace | bool
  tags:
    - portal
    - portal-demo-seed

- name: Check existing portal database before targeted domain demo seed
  ansible.builtin.stat:
    path: "{{ thesis_state_root }}/portal.db"
  register: _portal_domain_demo_db_stat
  when: thesis_portal_domain_demo_seed | bool
  tags:
    - portal-domain-demo-seed

- name: Back up portal database before targeted domain demo seed
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import sqlite3, sys; source = sqlite3.connect(sys.argv[1]); target = sqlite3.connect(sys.argv[2]); source.backup(target); target.close(); source.close()"
      - "{{ thesis_state_root }}/portal.db"
      - "{{ management_backup_root }}/portal.domain-demo.{{ ansible_date_time.iso8601_basic_short }}.db.bak"
  when:
    - thesis_portal_domain_demo_seed | bool
    - _portal_domain_demo_db_stat.stat.exists
  tags:
    - portal-domain-demo-seed

- name: Restrict targeted domain demo database backup
  ansible.builtin.file:
    path: "{{ management_backup_root }}/portal.domain-demo.{{ ansible_date_time.iso8601_basic_short }}.db.bak"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"
  when:
    - thesis_portal_domain_demo_seed | bool
    - _portal_domain_demo_db_stat.stat.exists
  tags:
    - portal-domain-demo-seed

- name: Merge targeted domain demo cohorts
  when: thesis_portal_domain_demo_seed | bool
  block:
    - name: Stop portal for targeted domain demo seed
      ansible.builtin.systemd:
        name: thesis-portal
        state: stopped
        daemon_reload: true

    - name: Load targeted domain demo cohorts
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - app.domain_demo_seed
          - --data
          - "{{ management_controller_root }}/lab-controller-api/domain-demo-data.json"
          - --credentials
          - "{{ thesis_portal_domain_demo_credentials_path }}"
        chdir: "{{ management_controller_root }}/lab-controller-api"
      environment:
        PORTAL_DB_PATH: "{{ thesis_state_root }}/portal.db"
        EVENT_LOG_PATH: "{{ thesis_portal_event_log }}"
        RESULTS_DIR: "{{ thesis_state_root }}/results"
        LABS_DIR: "{{ management_controller_root }}/lab-controller-api/labs"
      register: _portal_domain_demo_seed
      changed_when: true
  always:
    - name: Ensure portal is running after targeted domain demo seed
      ansible.builtin.systemd:
        name: thesis-portal
        state: started
        daemon_reload: true
  tags:
    - portal-domain-demo-seed

- name: Ensure local private credential directory exists for domain demo seed
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../.secrets"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: thesis_portal_domain_demo_seed | bool
  tags:
    - portal-domain-demo-seed

- name: Fetch generated domain demo credentials locally
  ansible.builtin.fetch:
    src: "{{ thesis_portal_domain_demo_credentials_path }}"
    dest: "{{ playbook_dir }}/../../.secrets/domain-demo-credentials.csv"
    flat: true
  when: thesis_portal_domain_demo_seed | bool
  tags:
    - portal-domain-demo-seed

- name: Restrict fetched domain demo credentials locally
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../.secrets/domain-demo-credentials.csv"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: thesis_portal_domain_demo_seed | bool
  tags:
    - portal-domain-demo-seed

- name: Check existing portal database before survey student seed
  ansible.builtin.stat:
    path: "{{ thesis_state_root }}/portal.db"
  register: _portal_survey_student_db_stat
  when: thesis_portal_survey_student_seed | bool
  tags:
    - portal-survey-student-seed

- name: Back up portal database before survey student seed
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import sqlite3, sys; source = sqlite3.connect(sys.argv[1]); target = sqlite3.connect(sys.argv[2]); source.backup(target); target.close(); source.close()"
      - "{{ thesis_state_root }}/portal.db"
      - "{{ management_backup_root }}/portal.survey-students.{{ ansible_date_time.iso8601_basic_short }}.db.bak"
  when:
    - thesis_portal_survey_student_seed | bool
    - _portal_survey_student_db_stat.stat.exists
  tags:
    - portal-survey-student-seed

- name: Restrict survey student database backup
  ansible.builtin.file:
    path: "{{ management_backup_root }}/portal.survey-students.{{ ansible_date_time.iso8601_basic_short }}.db.bak"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"
  when:
    - thesis_portal_survey_student_seed | bool
    - _portal_survey_student_db_stat.stat.exists
  tags:
    - portal-survey-student-seed

- name: Append survey students
  when: thesis_portal_survey_student_seed | bool
  block:
    - name: Stop portal for survey student seed
      ansible.builtin.systemd:
        name: thesis-portal
        state: stopped
        daemon_reload: true

    - name: Create append-only survey student cohort
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - app.survey_student_seed
          - --group
          - System Security (Survey)
          - --semester
          - SS 2026
          - --start-number
          - "{{ thesis_portal_survey_student_start_number | string }}"
          - --count
          - "{{ thesis_portal_survey_student_count | string }}"
          - --credentials
          - "{{ thesis_portal_survey_student_credentials_path }}"
        chdir: "{{ management_controller_root }}/lab-controller-api"
      environment:
        PORTAL_DB_PATH: "{{ thesis_state_root }}/portal.db"
        EVENT_LOG_PATH: "{{ thesis_portal_event_log }}"
        RESULTS_DIR: "{{ thesis_state_root }}/results"
        LABS_DIR: "{{ management_controller_root }}/lab-controller-api/labs"
      changed_when: true
  always:
    - name: Ensure portal is running after survey student seed
      ansible.builtin.systemd:
        name: thesis-portal
        state: started
        daemon_reload: true
  tags:
    - portal-survey-student-seed

- name: Ensure local private credential directory exists for survey student seed
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../.secrets"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: thesis_portal_survey_student_seed | bool
  tags:
    - portal-survey-student-seed

- name: Fetch generated survey student credentials locally
  ansible.builtin.fetch:
    src: "{{ thesis_portal_survey_student_credentials_path }}"
    dest: "{{ playbook_dir }}/../../.secrets/survey-student-extension-credentials.csv"
    flat: true
  when: thesis_portal_survey_student_seed | bool
  tags:
    - portal-survey-student-seed

- name: Restrict fetched survey student credentials locally
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../.secrets/survey-student-extension-credentials.csv"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: thesis_portal_survey_student_seed | bool
  tags:
    - portal-survey-student-seed

- name: Generate controller SSH key
  ansible.builtin.user:
    name: root
    generate_ssh_key: true
    ssh_key_file: "{{ management_controller_ssh_key_path }}"
    ssh_key_type: "{{ management_controller_ssh_key_type }}"
    ssh_key_comment: "{{ management_controller_ssh_key_comment }}"
    force: false
  notify: Restart thesis portal
  tags:
    - portal
    - portal-api

- name: Restrict generated controller SSH private key
  ansible.builtin.file:
    path: "{{ management_controller_ssh_key_path }}"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0600"
  notify: Restart thesis portal
  tags:
    - portal
    - portal-api

- name: Check generated controller SSH public key
  ansible.builtin.stat:
    path: "{{ management_controller_ssh_key_path }}.pub"
  register: management_controller_public_key_stat
  changed_when: false
  tags:
    - portal
    - portal-api

- name: Derive missing controller SSH public key
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -y
      - -f
      - "{{ management_controller_ssh_key_path }}"
  register: management_controller_public_key_derived
  changed_when: false
  when: not management_controller_public_key_stat.stat.exists
  tags:
    - portal
    - portal-api

- name: Install derived controller SSH public key
  ansible.builtin.copy:
    content: "{{ management_controller_public_key_derived.stdout }}\n"
    dest: "{{ management_controller_ssh_key_path }}.pub"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"
  when: not management_controller_public_key_stat.stat.exists
  tags:
    - portal
    - portal-api

- name: Install generated controller SSH public key permissions
  ansible.builtin.file:
    path: "{{ management_controller_ssh_key_path }}.pub"
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0640"
  tags:
    - portal
    - portal-api

- name: Check SELinux Nginx network proxy boolean
  ansible.builtin.command:
    argv:
      - getsebool
      - httpd_can_network_connect
  register: _sebool_result
  changed_when: false
  failed_when: false
  when: thesis_portal_nginx_enabled | bool
  tags:
    - nginx

- name: Persist SELinux Nginx network proxy boolean
  ansible.builtin.command:
    argv:
      - setsebool
      - -P
      - httpd_can_network_connect
      - "on"
  changed_when: true
  when:
    - thesis_portal_nginx_enabled | bool
    - not ansible_check_mode
    - _sebool_result.rc == 0
    - "'--> on' not in _sebool_result.stdout"
  tags:
    - nginx

- name: Ensure ACME HTTP-01 webroot directory exists
  ansible.builtin.file:
    path: "{{ thesis_portal_acme_webroot }}"
    state: directory
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0750"
  when: thesis_portal_nginx_enabled | bool
  tags:
    - nginx
    - tls

- name: Create isolated virtualenv for certbot
  ansible.builtin.command:
    argv: [python3, -m, venv, "{{ thesis_certbot_venv }}"]
    creates: "{{ thesis_certbot_venv }}/bin/python3"
  when: thesis_portal_nginx_enabled | bool
  tags:
    - tls

- name: Install certbot into isolated virtualenv
  ansible.builtin.pip:
    name: certbot
    virtualenv: "{{ thesis_certbot_venv }}"
    virtualenv_command: python3 -m venv
  when: thesis_portal_nginx_enabled | bool
  tags:
    - tls

# Gated behind thesis_portal_tls_request (default false) - only meant to be run explicitly,
# once, after the public firewall change lands. HTTP-01 validation will fail until port 80
# is reachable from the public internet, so this must never run on a routine deploy.
- name: Request Let's Encrypt certificate via HTTP-01 webroot challenge
  ansible.builtin.command:
    argv:
      - "{{ thesis_certbot_venv }}/bin/certbot"
      - certonly
      - --webroot
      - --webroot-path
      - "{{ thesis_portal_acme_webroot }}"
      - -d
      - "{{ thesis_portal_public_hostname }}"
      - --non-interactive
      - --agree-tos
      - -m
      - "{{ thesis_portal_letsencrypt_email }}"
    creates: "{{ thesis_letsencrypt_live_dir }}/fullchain.pem"
  when:
    - thesis_portal_nginx_enabled | bool
    - thesis_portal_tls_request | bool
  register: _certbot_issue
  tags:
    - tls-request

- name: Relabel Let's Encrypt certificate directories for SELinux
  ansible.builtin.command:
    argv: [restorecon, -Rv, /etc/letsencrypt/live, /etc/letsencrypt/archive]
  when: _certbot_issue is changed
  notify: Restart nginx
  tags:
    - tls-request

- name: Check for an issued Let's Encrypt certificate
  ansible.builtin.stat:
    path: "{{ thesis_letsencrypt_live_dir }}/fullchain.pem"
  register: _letsencrypt_cert_stat
  when: thesis_portal_nginx_enabled | bool
  tags:
    - nginx
    - tls

- name: Install certbot renewal systemd units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: certbot-renew.service.j2
      dest: /etc/systemd/system/certbot-renew.service
    - src: certbot-renew.timer.j2
      dest: /etc/systemd/system/certbot-renew.timer
  when:
    - thesis_portal_nginx_enabled | bool
    - _letsencrypt_cert_stat.stat.exists
  notify:
    - Reload systemd
    - Enable certbot renewal timer
  tags:
    - tls

- name: Install Nginx portal reverse proxy
  ansible.builtin.template:
    src: thesis-portal-nginx.conf.j2
    dest: /etc/nginx/conf.d/thesis-portal.conf
    owner: root
    group: root
    mode: "0644"
  vars:
    letsencrypt_cert_exists: "{{ _letsencrypt_cert_stat.stat.exists | default(false) }}"
  notify: Restart nginx
  when: thesis_portal_nginx_enabled | bool
  tags:
    - nginx

- name: Apply service definition handlers before enabling services
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode
  tags:
    - portal
    - portal-api
    - portal-ui
    - docs
    - nginx

- name: Enable thesis portal service
  ansible.builtin.service:
    name: thesis-portal
    state: started
    enabled: true
  when: not ansible_check_mode
  tags:
    - portal
    - portal-api
    - portal-ui

- name: Enable Nginx reverse proxy service
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  when:
    - thesis_portal_nginx_enabled | bool
    - not ansible_check_mode
  tags:
    - nginx
