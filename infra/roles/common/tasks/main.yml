---
- name: Install baseline packages
  ansible.builtin.package:
    name: "{{ thesis_base_packages }}"
    state: present

- name: Create thesis admin group
  ansible.builtin.group:
    name: "{{ thesis_admin_group }}"
    state: present

- name: Create platform directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0750"
  loop: "{{ thesis_common_directories }}"

- name: Apply optional SSH hardening after admin access is confirmed
  when: thesis_manage_ssh_hardening | bool
  block:
    - name: Manage SSH password authentication policy
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication\\s+"
        line: "PasswordAuthentication {{ thesis_ssh_password_authentication }}"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart ssh

    - name: Manage SSH root login policy
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin\\s+"
        line: "PermitRootLogin {{ thesis_ssh_permit_root_login }}"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart ssh

- name: Ensure time sync service is enabled when available
  ansible.builtin.service:
    name: systemd-timesyncd
    state: started
    enabled: true
  failed_when: false

- name: Install thesis logrotate policy
  ansible.builtin.template:
    src: thesis-labs.logrotate.j2
    dest: /etc/logrotate.d/thesis-labs
    owner: root
    group: root
    mode: "0644"
