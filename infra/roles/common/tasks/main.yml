---
- name: Install baseline packages
  ansible.builtin.package:
    name: "{{ thesis_base_packages }}"
    state: present

- name: Create thesis admin group
  ansible.builtin.group:
    name: "{{ thesis_admin_group }}"
    state: present

- name: Create platform directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ thesis_admin_group }}"
    mode: "0750"
  loop: "{{ thesis_common_directories }}"

- name: Ensure chrony time sync service is enabled
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

- name: Install thesis logrotate policy
  ansible.builtin.template:
    src: thesis-labs.logrotate.j2
    dest: /etc/logrotate.d/thesis-labs
    owner: root
    group: root
    mode: "0644"
