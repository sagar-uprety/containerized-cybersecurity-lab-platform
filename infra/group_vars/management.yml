---
management_controller_root: "{{ thesis_runtime_root }}/controller"
management_docs_root: "{{ thesis_runtime_root }}/docs"
management_backup_root: "{{ thesis_state_root }}/backups"
thesis_portal_backup_retain_count: 5
management_controller_ssh_key_path: "{{ management_controller_root }}/controller_key"
management_controller_ssh_key_type: ed25519
management_controller_ssh_key_comment: "thesis-labs-controller@{{ inventory_hostname }}"

management_directories:
  - "{{ management_controller_root }}"
  - "{{ management_docs_root }}"
  - "{{ management_docs_root }}/source"
  - "{{ management_backup_root }}"

# TLS / Let's Encrypt: public DNS name of the management host
thesis_portal_public_hostname: portal.example.org
# Contact address Let's Encrypt uses for expiry/problem notices - set to a real, monitored inbox before requesting.
thesis_portal_letsencrypt_email: "admin@example.org"
# Explicit gate: only attempt certonly issuance when requested (-e thesis_portal_tls_request=true),
# so routine deploys never hammer Let's Encrypt with a doomed request while port 80 is still VPN/campus-only.
thesis_portal_tls_request: false
thesis_portal_acme_webroot: "{{ thesis_runtime_root }}/acme-challenge"
# certbot lives in its own venv, never system pip3 - x02's dnf/subscription-manager depend on the
# RPM-managed python3-requests/python3-urllib3 in system site-packages; pip installing certbot there
# would silently upgrade those and can break dnf (confirmed present: python3-requests-2.25.1 RPM).
thesis_certbot_venv: "{{ thesis_runtime_root }}/certbot-venv"
thesis_letsencrypt_live_dir: "/etc/letsencrypt/live/{{ thesis_portal_public_hostname }}"

# Session-signing secret, generated once on the host and readable only by the
# account the portal runs as. Set to true for one run to rotate it.
thesis_portal_session_secret_path: "{{ thesis_config_root }}/portal-session.key"
thesis_portal_rotate_session_secret: false

# nginx forwards the per-student SSH ports to the lab worker, so a student's
# SSH client reaches the workstation through the management host only.
thesis_portal_ssh_stream_config: /etc/nginx/stream.d/thesis-lab-ssh.conf
management_lab_worker_address: "{{ hostvars[groups['lab_workers'][0]]['ansible_default_ipv4']['address'] | default(hostvars[groups['lab_workers'][0]].ansible_host) }}"
