---
thesis_platform_name: thesis-labs

thesis_runtime_root: /opt/thesis-labs
thesis_state_root: /var/lib/thesis-labs
thesis_log_root: /var/log/thesis-labs
thesis_config_root: /etc/thesis-labs

thesis_admin_group: thesis-admins
thesis_labadmin_user: labadmin
thesis_labadmin_home: /var/lib/labadmin
thesis_labctl_path: /usr/local/bin/labctl
thesis_labctl_lib_root: /usr/local/lib/thesis-labs
thesis_labctl_wrapper_path: /usr/local/sbin/labctl-ssh-wrapper

thesis_base_packages:
  - ca-certificates
  - curl
  - git
  - jq
  - chrony
  - openssh-clients
  - openssh-server
  - python3
  - python3-pip
  - python3-jsonschema
  - python3-pyyaml
  - rsync
  - sudo
  - tar
  - tmux
  - unzip

thesis_container_runtime: podman

podman_supported_architectures:
  - ppc64le

podman_packages:
  - podman
  - buildah
  - skopeo

thesis_common_directories:
  - "{{ thesis_runtime_root }}"
  - "{{ thesis_state_root }}"
  - "{{ thesis_log_root }}"
  - "{{ thesis_config_root }}"

thesis_students:
  - id: student01
    number: 1
    password: smoke-password

thesis_instructors:
  - username: instructor
    password: REDACTED
    role: instructor

thesis_max_concurrent_students: 10
thesis_evaluation_mode: false
thesis_portal_nginx_enabled: true
thesis_portal_event_log: "{{ thesis_log_root }}/portal-events.jsonl"
thesis_portal_demo_replace: false
thesis_portal_demo_credentials_path: "{{ thesis_state_root }}/demo-credentials.csv"
thesis_portal_domain_demo_seed: false
thesis_portal_domain_demo_credentials_path: "{{ thesis_state_root }}/domain-demo-credentials.csv"
thesis_portal_survey_student_seed: false
thesis_portal_survey_student_start_number: 113
thesis_portal_survey_student_count: 15
thesis_portal_survey_student_credentials_path: "{{ thesis_state_root }}/survey-student-extension-credentials.csv"
