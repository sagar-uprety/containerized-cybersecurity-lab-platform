---
thesis_platform_name: thesis-labs

thesis_runtime_root: /opt/thesis-labs
thesis_state_root: /var/lib/thesis-labs
thesis_log_root: /var/log/thesis-labs
thesis_config_root: /etc/thesis-labs

thesis_admin_group: thesis-admins
thesis_labadmin_user: labadmin
thesis_labadmin_home: /var/lib/labadmin
thesis_labctl_path: /usr/local/bin/labctl
thesis_labctl_lib_root: /usr/local/lib/thesis-labs
thesis_labctl_wrapper_path: /usr/local/sbin/labctl-ssh-wrapper

thesis_base_packages:
  - ca-certificates
  - curl
  - git
  - jq
  - chrony
  - logrotate
  - openssh-clients
  - openssh-server
  - python3
  - python3-pip
  - python3-jinja2
  - python3-jsonschema
  - python3-pyyaml
  - rsync
  - sudo
  - tar
  - tmux
  - unzip

thesis_container_runtime: podman
thesis_supported_worker_runtimes:
  - podman
  - docker

podman_supported_architectures:
  - ppc64le
  - x86_64

podman_packages:
  - podman
  - buildah
  - skopeo

thesis_common_directories:
  - "{{ thesis_runtime_root }}"
  - "{{ thesis_state_root }}"
  - "{{ thesis_log_root }}"
  - "{{ thesis_config_root }}"

thesis_ssh_port: 22
thesis_sshd_service: sshd

thesis_student_terminal_port_range: "19001-19999"
thesis_student_ssh_port_range: "22001-22999"
thesis_student_app_port_range: "18001-18999"

thesis_students:
  - id: student01
    number: 1
    password: smoke-password

thesis_lab_scenarios:
  - redis-exposed

thesis_instructors:
  - username: instructor
    password: admin-password
    role: admin

thesis_max_concurrent_students: 1
thesis_evaluation_mode: false
thesis_portal_nginx_enabled: true
thesis_portal_event_log: "{{ thesis_log_root }}/portal-events.jsonl"
