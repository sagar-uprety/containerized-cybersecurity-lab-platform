# Replace the host names and addresses with your own machines.
# Host names are free labels; the group names below are fixed.
[lab_workers]
lab-worker ansible_host=192.0.2.10

[management]
lab-management ansible_host=192.0.2.20

[platform:children]
lab_workers
management

[platform:vars]
ansible_user=root
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
