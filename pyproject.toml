# --------------------------------------------------------------------
#  Ruff - Python linter + formatter (replaces Flake8 / isort / Black)
# --------------------------------------------------------------------
[tool.ruff]
line-length = 100                                  # match Prettier's printWidth
target-version = "py39"
extend-exclude = [
  "node_modules",
  "site",
]

[tool.ruff.lint]
select = [
  "F",
  "I",
  "E",
  "W",
  "UP",
  "B",
  "SIM",
  "ARG",
  "RUF",
  "C4",
  "PERF",
  "ERA",
  "TRY",
  "T20",
  "N",
  "A",
  "INP",
  "RET",
  "PTH",
  "EXE",
  "PLC",
  "PLE",
]
ignore = [
  "TRY003", # custom exception message classes would add noise for little value here
  "TRY301", # small validation raises inside try blocks are clearer than helper extraction
  "UP045",  # keep Python 3.9-compatible Optional annotations for the RHEL host baseline
  "PERF203", # small validation loops favor readable per-item error handling over precomputed exceptions
]

[tool.ruff.lint.per-file-ignores]
"controller/labctl" = ["E402"]                       # E402: module-level imports after script logic
"controller/lab-controller-api/app/*.py" = ["B008"]  # B008: FastAPI Depends() in defaults is idiomatic
"controller/labctl_core/cli.py" = ["T201"]            # T201: CLI usage text intentionally prints to stderr
"controller/labctl_core/lifecycle.py" = ["T201"]      # T201: labctl status/check output is stdout contract
"tests/*.py" = ["T201"]                               # T201: contract tests are standalone scripts; print("OK") is their pass signal
"labs/*/checks/*.py" = ["ERA001", "T201"]             # ERA001: checker comments document tuple result contracts
"labs/*/demo-app/*.py" = ["INP001", "TRY400"]         # INP001: demo apps are standalone container files
"labs/*/*.py" = ["INP001"]                             # lab-root helpers are standalone container scripts
"tools/generate_portal_demo.py" = ["INP001"]            # standalone fixture-generation script
"tools/build_gate.py" = ["INP001", "T201"]            # T201: check/update status is the CLI's stdout contract
"tools/create_lab.py" = ["INP001", "T201"]             # standalone instructor-facing scaffold CLI
"tools/pre_commit/*.py" = ["INP001", "T201"]          # T201: validators print actionable errors to stderr

[tool.ruff.format]
line-ending = "lf"

# --------------------------------------------------------------------
#  Bandit - Python security scanner
# --------------------------------------------------------------------
[tool.bandit]
exclude_dirs = [
  ".venv",
  "node_modules",
  "site",
  "test-results",
  "resources",
  "tests",            # test files may use assert / random intentionally
]
skips = [
  "B101",             # assert - allowed in test / lab code
  "B311",             # random - not used for crypto, safe to skip
]
