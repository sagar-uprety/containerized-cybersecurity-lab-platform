site_name: Thesis Lab Guides
site_description: Static guides for the thesis cybersecurity lab platform
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: mkdocs
extra_css:
  - stylesheets/tum-theme.css
markdown_extensions:
  - pymdownx.snippets:
      base_path:
        - ../../controller/lab-controller-api
        - .
      check_paths: true
plugins:
  - search

nav:
  - Home: index.md
  - Labs:
      - labs/redis-exposed.md
      - labs/ssh-weak-config.md
      - labs/firewall-source-port-bypass.md
      - labs/ldap-anonymous-bind.md
      - labs/unpatched-apache-cve.md
