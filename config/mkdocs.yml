site_name: Thesis Lab Guides
site_description: Static guides for the thesis cybersecurity lab platform
docs_dir: ../docs
site_dir: ../site
use_directory_urls: true
theme:
  name: mkdocs
extra_css:
  - stylesheets/tum-theme.css
markdown_extensions:
  - pymdownx.snippets:
      base_path:
        - ../../controller/lab-controller-api
        - .
      check_paths: true
plugins:
  - search

# MkDocs 1.6 infers navigation from docs/. Protected answer/instructor pages are
# still built and directly addressable, but intentionally omitted from nav.
not_in_nav: |
  /labs/*-solution.md
  /labs/*-instructor.md
